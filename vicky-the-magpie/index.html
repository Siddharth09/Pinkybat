<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vicky the Magpie</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1722;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{touch-action:none;user-select:none}.shell{position:fixed;inset:0;overflow:hidden}.game{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:14px;right:14px;z-index:5;display:flex;justify-content:space-between;color:#fff;pointer-events:none}.meters{font-size:46px;font-weight:1000;line-height:.9;letter-spacing:-2px;text-shadow:0 3px 6px #0007}.meters small{font-size:18px;letter-spacing:0}.scene{font-size:10px;font-weight:900;letter-spacing:1.6px;opacity:.92;margin-top:5px}.best{background:#0e1522b8;padding:9px 12px;border-radius:999px;font-size:10px;font-weight:900;height:max-content;box-shadow:0 5px 20px #0002}.start{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:linear-gradient(#101a2a08,#101a2ab0)}.titleWrap{text-align:center;color:#fff}.title{font-size:clamp(52px,13vw,94px);font-weight:1000;letter-spacing:-5px;line-height:.84;text-shadow:0 8px 20px #0005;animation:float 2.6s ease-in-out infinite}.title span{color:#ff76ad}.vickyMark{font-size:78px;filter:drop-shadow(0 10px 15px #0005);animation:float 2.2s ease-in-out infinite}.sub{color:#fff7;display:none}.crash{position:absolute;inset:0;z-index:12;display:none;place-items:center;background:linear-gradient(#101a2a00,#101a2abf);color:white;text-align:center}.crash .score{font-size:72px;font-weight:1000;color:#ff9fca}.crash button{border:0;border-radius:999px;padding:14px 38px;background:#ff6ea8;color:white;font-size:18px;font-weight:1000;box-shadow:0 7px #b53f72}button{cursor:pointer}@keyframes float{50%{transform:translateY(-10px) rotate(-1deg)}}
</style>
</head>
<body>
<div class="shell"><canvas class="game" id="game"></canvas>
<div class="hud"><div><div class="meters" id="meters">0<small> m</small></div><div class="scene" id="scene">SUNSET BEACH</div></div><div class="best" id="best">BEST 0 m</div></div>
<div class="start" id="start"><div class="titleWrap"><div class="vickyMark">🐦‍⬛</div><div class="title">VICKY <span>THE MAGPIE</span></div></div></div>
<div class="crash" id="crash"><div><div style="font-size:11px;letter-spacing:2px;font-weight:1000">YOU FLEW</div><div class="score" id="final">0</div><div style="font-weight:800">metres</div><p id="newBest"></p><button id="again">FLY AGAIN</button></div></div>
</div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),g=c.getContext('2d');const start=document.getElementById('start'),crash=document.getElementById('crash');const meters=document.getElementById('meters'),sceneEl=document.getElementById('scene'),bestEl=document.getElementById('best'),again=document.getElementById('again'),final=document.getElementById('final'),newBest=document.getElementById('newBest');
let W=innerWidth,H=innerHeight,dpr=1,last=0,state='menu',holding=false,t=0,dist=0,best=+localStorage.vickyMagpieBest||0,spawn=1,scroll=0,obs=[],wind=[],spark=[],crashT=0,crashVy=0,crashSpin=0,shake=0;
const bird={nx:.29,y:0,vy:0,r:22,wing:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const lerp=(a,b,p)=>a+(b-a)*p;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);bird.r=clamp(Math.min(W,H)*.046,17,25);if(state==='menu')bird.y=H*.52}addEventListener('resize',resize);resize();
function progress(){return clamp((t-20)/80,0,1)}
function forwardSpeed(){let p=progress();return lerp(52,190,p)+Math.max(0,p-.6)*120}
function difficulty(){let p=progress();return p}
function flap(){bird.vy=clamp(bird.vy-105,-170,80);bird.wing=.18;for(let i=0;i<4;i++)wind.push({x:bird.nx*W-18,y:bird.y+8+Math.random()*10,vx:-45-Math.random()*35,vy:(Math.random()-.5)*22,life:.55,len:18+Math.random()*28,a:.45+.35*Math.random()})}
function begin(){state='play';start.style.display='none';crash.style.display='none';t=0;dist=0;spawn=.6;scroll=0;obs=[];wind=[];spark=[];crashT=0;crashVy=0;crashSpin=0;shake=0;bird.y=H*.52;bird.vy=0;meters.innerHTML='0<small> m</small>'}
function beginCrash(){if(state!=='play')return;state='crash';holding=false;crashT=0;crashVy=-180;crashSpin=0;shake=.5;for(let i=0;i<40;i++)spark.push({x:bird.nx*W,y:bird.y,vx:-190+Math.random()*380,vy:-220+Math.random()*280,life:.8+Math.random()*.5,size:2+Math.random()*4})}
function finish(){let s=Math.floor(dist),nb=s>best;if(nb){best=s;localStorage.vickyMagpieBest=best}final.textContent=s;bestEl.textContent='BEST '+best+' m';newBest.textContent=nb?'NEW BEST!':'';crash.style.display='grid'}
function spawnObstacle(){let d=difficulty();let gap=lerp(Math.min(H*.46,280),Math.max(110,H*.22),d);let safe=H*.16;let gy=safe+Math.random()*Math.max(10,H-safe-gap-safe);let w=lerp(42,86,d);let x=W+50;let type=Math.floor(Math.random()*5);let pattern=Math.random();if(pattern<.22&&d>.35){let delta=(Math.random()>.5?1:-1)*lerp(24,90,d);gy=clamp(gy+delta,safe,H-gap-safe)}if(pattern>.82&&d>.55){gap*=.82}obs.push({x,y:0,w,h:gy,type},{x,y:gy+gap,w,H-gy-gap,type,passed:false})}
function hit(o){let px=bird.nx*W,py=bird.y;let rx=clamp(px,o.x,o.x+o.w),ry=clamp(py,o.y,o.y+o.h);return (px-rx)**2+(py-ry)**2<(bird.r*.78)**2}
function bg(scene){let sets=[['#68d4f1','#e8fbff'],['#18233b','#92a5bf'],['#efaa67','#ffe6b7'],['#77bd91','#d9f0cf'],['#5ba9d2','#d7f6ff']];let s=sets[scene],grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,s[0]);grad.addColorStop(1,s[1]);g.fillStyle=grad;g.fillRect(0,0,W,H);if(scene===0)beach();if(scene===1)city();if(scene===2)desert();if(scene===3)forest();if(scene===4)waterfall()}
function beach(){g.fillStyle='#55cbd4';g.fillRect(0,H*.76,W,H*.08);g.fillStyle='#f7d37d';g.fillRect(0,H*.84,W,H*.16);for(let i=-2;i<12;i++){let x=i*150-(scroll*.18%150);g.fillStyle='#6e9c58';g.fillRect(x+72,H*.62,5,H*.17);g.fillStyle='#3b8454';g.beginPath();g.arc(x+72,H*.61,28,Math.PI,0);g.fill()}}
function city(){let base=scroll*.25%180;for(let i=-2;i<W/92+4;i++){let x=i*92-base,h=120+(Math.abs(i*53)%190);g.fillStyle=['#24304b','#334360','#1c263c'][i%3];g.fillRect(x,H*.86-h,74,h);g.fillStyle='#ffd66a';for(let yy=H*.86-h+10;yy<H*.84;yy+=22)for(let xx=x+10;xx<x+61;xx+=18)g.fillRect(xx,yy,7,9)}g.fillStyle='#151d2f';g.fillRect(0,H*.86,W,H*.14)}
function desert(){for(let q=-2;q<9;q++){let x=q*280-(scroll*.14%280);g.fillStyle='#d28b4d';g.beginPath();g.moveTo(x,H*.84);g.quadraticCurveTo(x+130,H*.56,x+250,H*.84);g.fill()}g.fillStyle='#fff0c7';g.beginPath();g.arc(W*.78,H*.18,42,0,7);g.fill();}
function forest(){for(let q=-2;q<13;q++){let x=q*120-(scroll*.12%120),h=100+Math.abs(q*37)%100;g.fillStyle='#4a915b';g.fillRect(x+47,H*.73,10,H*.22);g.fillStyle='#2e724e';for(let k=0;k<3;k++){g.beginPath();g.arc(x+52,H*.7-k*25,44-k*6,Math.PI,0);g.fill()}}g.fillStyle='rgba(255,255,255,.16)';for(let i=0;i<7;i++)g.fillRect(i*170-(scroll*.03%170),H*.28,4,H*.5)}
function waterfall(){for(let q=-2;q<9;q++){let x=q*180-(scroll*.14%180);g.fillStyle='#5e9461';g.beginPath();g.moveTo(x,H*.82);g.lineTo(x+80,H*.45);g.lineTo(x+160,H*.82);g.fill()}g.fillStyle='#76bfdf';g.fillRect(W*.6,H*.28,62,H*.58);g.fillStyle='#c9f0ff';g.globalAlpha=.65;for(let i=0;i<9;i++)g.fillRect(W*.58+i*7,H*.35+Math.sin(i)*14,4,H*.44);g.globalAlpha=1;g.fillStyle='#5e9ca0';g.fillRect(W*.55,H*.8,W*.28,H*.08)}
function drawObstacle(o){let x=o.x,y=o.y,w=o.w,h=o.h;g.save();if(o.type===0){g.fillStyle='#4f9158';g.fillRect(x+w*.36,y,w*.28,h);g.fillStyle='#296a49';g.beginPath();g.arc(x+w*.5,y+22,w*.62,Math.PI,0);g.fill();}else if(o.type===1){g.fillStyle='#273348';g.fillRect(x,y,w,h);g.fillStyle='#ffdb72';for(let yy=y+10;yy<y+h-10;yy+=25)for(let xx=x+8;xx<x+w-7;xx+=17)g.fillRect(xx,yy,7,10)}else if(o.type===2){g.fillStyle='#c1834b';g.fillRect(x+w*.38,y,w*.24,h);g.fillStyle='#7a9e55';g.beginPath();g.arc(x+w*.5,y+18,w*.62,Math.PI,0);g.fill()}else if(o.type===3){g.fillStyle='#3f8652';g.fillRect(x+w*.34,y,w*.32,h);for(let i=0;i<4;i++){g.fillStyle=i%2?'#2d6e48':'#5a9f65';g.fillRect(x+w*(.12+i*.24),y+24,w*.32,18)}}else{g.fillStyle='#57a0c5';g.fillRect(x+w*.38,y,w*.24,h);g.fillStyle='#447f58';g.beginPath();g.arc(x+w*.5,y+18,w*.65,Math.PI,0);g.fill()}g.restore()}
function drawWind(){for(let i=wind.length-1;i>=0;i--){let p=wind[i];p.life-=.016;p.x+=p.vx*.016;p.y+=p.vy*.016;if(p.life<=0){wind.splice(i,1);continue}g.globalAlpha=p.a*(p.life/.55);g.strokeStyle='#ffffff';g.lineWidth=2;g.beginPath();g.moveTo(p.x,p.y);g.quadraticCurveTo(p.x-p.len*.45,p.y+p.vy*.22,p.x-p.len,p.y+p.vy*.32);g.stroke()}g.globalAlpha=1}
function drawSpark(){for(let i=spark.length-1;i>=0;i--){let p=spark[i];p.life-=.016;p.x+=p.vx*.016;p.y+=p.vy*.016;p.vy+=380*.016;if(p.life<=0){spark.splice(i,1);continue}g.globalAlpha=Math.max(0,p.life);g.fillStyle=i%3?'#f7d76f':'#ff7cad';g.beginPath();g.arc(p.x,p.y,p.size,0,7);g.fill()}g.globalAlpha=1}
function drawBird(){let x=bird.nx*W,y=bird.y,fl=.5+Math.sin(t*13)*.5;g.save();g.translate(x,y);if(state==='crash')g.rotate(crashSpin);let body=g.createRadialGradient(-5,-8,4,2,7,26);body.addColorStop(0,'#4c5966');body.addColorStop(.52,'#1d2833');body.addColorStop(1,'#0c1219');g.fillStyle=body;g.beginPath();g.ellipse(0,4,18,24,0,0,7);g.fill();let head=g.createRadialGradient(-6,-12,2,3,-5,21);head.addColorStop(0,'#6a7680');head.addColorStop(1,'#10171f');g.fillStyle=head;g.beginPath();g.arc(0,-10,16,0,7);g.fill();g.strokeStyle='rgba(255,255,255,.16)';g.lineWidth=2;g.stroke();g.fillStyle='#f3f5f7';g.beginPath();g.moveTo(-13,-10);g.lineTo(-5,-27);g.lineTo(3,-20);g.lineTo(9,-27);g.lineTo(14,-8);g.lineTo(7,-3);g.lineTo(-1,-10);g.lineTo(-8,-3);g.closePath();g.fill();g.fillStyle='#fff3f7';g.globalAlpha=.95;g.beginPath();g.ellipse(0,14,11,7,0,0,7);g.fill();g.globalAlpha=1;g.fillStyle='#f28cb9';g.beginPath();g.arc(-3,-13,1.8,0,7);g.arc(4,-12,1.5,0,7);g.fill();g.fillStyle='#ffbcda';g.beginPath();g.arc(6,-11,2.2,0,7);g.fill();g.fillStyle='#333b41';g.beginPath();g.moveTo(13,-4);g.lineTo(27,0);g.lineTo(14,5);g.closePath();g.fill();g.strokeStyle='#0d141a';g.lineWidth=3;g.beginPath();g.moveTo(-10,5);g.quadraticCurveTo(-35,-22-10*fl,-49,-8);g.quadraticCurveTo(-35,11,-9,13);g.moveTo(10,5);g.quadraticCurveTo(35,-22-10*fl,49,-8);g.quadraticCurveTo(35,11,9,13);g.stroke();g.fillStyle='#18232c';g.beginPath();g.moveTo(-11,5);g.quadraticCurveTo(-35,-17-7*fl,-49,-8);g.quadraticCurveTo(-35,10,-10,13);g.closePath();g.fill();g.beginPath();g.moveTo(11,5);g.quadraticCurveTo(35,-17-7*fl,49,-8);g.quadraticCurveTo(35,10,10,13);g.closePath();g.fill();g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=1.1;for(let i=0;i<6;i++){g.beginPath();g.moveTo(-12,8+i);g.quadraticCurveTo(-33,-4-i,-43,-2-i);g.stroke();g.beginPath();g.moveTo(12,8+i);g.quadraticCurveTo(33,-4-i,43,-2-i);g.stroke()}g.restore()}
function update(dt){t+=dt;let sp=forwardSpeed();scroll+=sp*dt;dist+=sp*dt*.06;let d=difficulty();let scene=Math.floor(dist/520)%5;sceneEl.textContent=['SUNSET BEACH','NEON NEW YORK','DUSTY DESERT','MISTY FOREST','WATERFALL VALLEY'][scene];if(holding){flap();bird.vy-=120*dt}bird.vy+=260*dt;bird.vy*=.992;bird.y+=bird.vy*dt;bird.wing=.8;if(bird.y<bird.r||bird.y>H-bird.r)return beginCrash();spawn-=dt;let interval=lerp(2.8,1.05,d);if(spawn<=0){spawnObstacle();spawn=interval*(.88+Math.random()*.28)}for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.x-=sp*dt;if(o.x+o.w<-80)obs.splice(i,1);else if(hit(o))return beginCrash()}if(Math.random()<dt*(5+3*d))wind.push({x:bird.nx*W-18,y:bird.y+Math.random()*15,vx:-40-Math.random()*35,vy:(Math.random()-.5)*18,life:.55,len:16+Math.random()*24,a:.28+.25*Math.random()});meters.innerHTML=Math.floor(dist)+'<small> m</small>'}
function updateCrash(dt){crashT+=dt;crashVy+=1100*dt;bird.y+=crashVy*dt;crashSpin+=dt*8;shake*=.92;drawSpark();if(bird.y>H+80||crashT>1.35){finish();}}
function draw(){let s=Math.floor(dist/520)%5;g.save();if(shake)g.translate((Math.random()-.5)*W*shake,(Math.random()-.5)*H*shake);bg(s);obs.forEach(drawObstacle);drawWind();drawSpark();drawBird();g.restore();if(state==='crash'){g.fillStyle=`rgba(255,120,150,${Math.max(0,.2*Math.sin(crashT*28))})`;g.fillRect(0,0,W,H)}}
function frame(now){let dt=Math.min(.033,(now-last)/1000||.016);last=now;if(state==='play')update(dt);else if(state==='crash')updateCrash(dt);else t+=dt;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function down(e){e.preventDefault();if(state==='menu')begin();if(state==='play')holding=true}function up(){holding=false}addEventListener('pointerdown',down,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up);addEventListener('blur',up);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='menu')begin();holding=true}});addEventListener('keyup',e=>{if(e.code==='Space')holding=false});again.onclick=begin;bestEl.textContent='BEST '+best+' m';
})();
</script>
</body></html>
