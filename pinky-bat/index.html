<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pinky Bat</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#17152a}body{touch-action:none;font-family:system-ui;color:white}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:1000;z-index:2;pointer-events:none}.m{font-size:50px;text-shadow:0 3px 5px #0006}.m small{font-size:18px}.s{font-size:10px;letter-spacing:2px}.b{background:#17152a99;padding:9px 12px;border-radius:20px;font-size:11px;height:max-content}.panel{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#17152a08,#17152abd);text-align:center;z-index:3}.word{font-size:clamp(54px,14vw,94px);font-weight:1000;letter-spacing:-5px;line-height:.82;text-shadow:0 8px 18px #0006}.pink{color:#ff4f93}.bat{font-size:82px;animation:b 1.5s ease-in-out infinite}.sub{opacity:.85;font-weight:700;margin:20px 0 28px}button{border:0;border-radius:30px;padding:15px 44px;background:#ff4f93;color:white;font-size:19px;font-weight:1000;box-shadow:0 7px #b92c61}@keyframes b{50%{transform:translateY(-10px) rotate(3deg)}}#over{display:none}#test{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:4;font-size:11px;background:#17152a88;padding:7px 10px;border-radius:16px;color:#fff9;white-space:nowrap}</style></head><body><canvas id="c"></canvas><div id="hud"><div><div id="m" class="m">0<small> m</small></div><div id="scene" class="s">SUNSET BEACH</div></div><div id="best" class="b">BEST 0 m</div></div><div id="start" class="panel"><div><div class="bat">🦇</div><div class="word">PINKY <span class="pink">BAT</span></div><div class="sub">Touch and hold to fly • release to fall</div><button id="go">START</button></div></div><div id="over" class="panel"><div><div style="font-size:11px;letter-spacing:2px;font-weight:1000">YOU FLEW</div><div id="final" class="m">0</div><div>metres</div><p id="nb"></p><button id="again">TRY AGAIN</button></div></div><div id="test">Phone: touch &amp; hold • Desktop: hold mouse / SPACE</div><script>(()=>{const c=document.getElementById('c'),g=c.getContext('2d'),S=document.getElementById('start'),O=document.getElementById('over'),M=document.getElementById('m'),B=document.getElementById('best'),L=document.getElementById('scene');let W,H,d=1,st='menu',hold=0,last=0,t=0,dist=0,best=+localStorage.pinkyBatBest||0,spawn=.7,scroll=0,obs=[],bits=[];const bird={x:.28,y:0,vy:0,r:22};const themes=['SUNSET BEACH','NEON NEW YORK','DUSTY DESERT','MISTY FOREST','WATERFALL VALLEY'];function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);bird.y=H*.5;bird.r=Math.max(17,Math.min(24,Math.min(W,H)*.045))}addEventListener('resize',resize);resize();function start(){st='play';S.style.display='none';O.style.display='none';dist=0;spawn=.7;scroll=0;obs=[];bits=[];bird.y=H*.5;bird.vy=0}function end(){st='over';hold=0;let n=Math.floor(dist),nb=n>best;if(nb){best=n;localStorage.pinkyBatBest=best}document.getElementById('final').textContent=n;document.getElementById('nb').textContent=nb?'NEW BEST!':'';B.textContent='BEST '+best+' m';O.style.display='grid'}function flap(){bird.vy=Math.max(-300,bird.vy-102);for(let i=0;i<2;i++)bits.push({x:bird.x*W-16,y:bird.y+8,vx:-50,vy:-10+Math.random()*20,life:.35,k:0})}function ob(){let gap=Math.max(160,Math.min(H*.48,310-dist*.004)),gy=H*.16+Math.random()*(H*.64-gap),w=Math.max(48,Math.min(92,W*.14+dist*.0017)),k=Math.floor(dist/420)%5;obs.push({x:W+30,y:0,w,h:gy,k},{x:W+30,y:gy+gap,w,h:H-gy-gap,k})}function hit(o){let px=bird.x*W,py=bird.y,rx=Math.max(o.x,Math.min(px,o.x+o.w)),ry=Math.max(o.y,Math.min(py,o.y+o.h));return(px-rx)**2+(py-ry)**2<(bird.r*.8)**2}function update(dt){t+=dt;let sp=t<=20?49.5:Math.min(420,49.5+(t-20)*3.2+dist*.12);scroll+=sp*dt;dist+=sp*dt*.055;if(hold){flap()}bird.vy+=820*dt;bird.vy*=.994;bird.y+=bird.vy*dt;if(bird.y<bird.r||bird.y>H-bird.r)return end();spawn-=dt;if(spawn<=0){ob();spawn=Math.max(.72,1.55-dist*.00005)}for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.x-=sp*dt;if(o.x+o.w<-80)obs.splice(i,1);else if(hit(o))return end()}if(Math.random()<dt*10)bits.push({x:bird.x*W-18,y:bird.y+12,vx:-20,vy:Math.random()*24,life:.65,k:2,len:12+Math.random()*20});for(let i=bits.length-1;i>=0;i--){let p=bits[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;if(p.life<=0)bits.splice(i,1)}M.innerHTML=Math.floor(dist)+'<small> m</small>';L.textContent=themes[Math.floor(dist/420)%5]}function bg(k){let a=[['#63d3f3','#e8fbff'],['#1a2140','#829abf'],['#f1a060','#ffe1ad'],['#7cc49f','#e4f6ca'],['#4aa5d1','#c8f1ff']][k],q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,a[0]);q.addColorStop(1,a[1]);g.fillStyle=q;g.fillRect(0,0,W,H);if(k===0){g.fillStyle='#5acfd6';g.fillRect(0,H*.76,W,H*.07);g.fillStyle='#f7d37d';g.fillRect(0,H*.83,W,H*.17)}if(k===1){g.fillStyle='#232d46';for(let i=-2;i<W/86+4;i++){let bx=i*86-(scroll*.27%86),bh=120+((i*37)%180);g.fillRect(bx,H*.86-bh,68,bh);g.fillStyle='#ffd367';for(let y=H*.86-bh+12;y<H*.83;y+=24)for(let x=bx+8;x<bx+58;x+=18)g.fillRect(x,y,7,9);g.fillStyle='#232d46'}g.fillStyle='#161b2f';g.fillRect(0,H*.86,W,H*.14)}if(k===2){g.fillStyle='#d28b4d';for(let i=-2;i<8;i++){let bx=i*280-(scroll*.18%280);g.beginPath();g.moveTo(bx,H*.83);g.quadraticCurveTo(bx+120,H*.54,bx+240,H*.83);g.fill()}g.fillStyle='#d1874b';g.fillRect(0,H*.83,W,H*.17)}if(k===3){g.fillStyle='#4f9b64';for(let i=-2;i<12;i++){let bx=i*120-(scroll*.12%120);g.beginPath();g.arc(bx+40,H*.78,48,Math.PI,Math.PI*2);g.fill()}g.fillRect(0,H*.78,W,H*.22)}if(k===4){g.fillStyle='#6fb8d3';g.fillRect(0,H*.72,W,H*.28);g.fillStyle='#6aa26d';for(let i=-1;i<10;i++){let bx=i*150-(scroll*.15%150);g.beginPath();g.moveTo(bx,H*.78);g.lineTo(bx+70,H*.44);g.lineTo(bx+140,H*.78);g.fill()}}}function drawObs(o){g.fillStyle=o.k===1?'#232d46':o.k===2?'#c68047':o.k===3?'#4f8c55':o.k===4?'#4c9dbf':'#ad7048';g.fillRect(o.x+o.w*.35,o.y,o.w*.3,o.h);if(o.k===0||o.k===1){g.fillStyle=o.k===0?'#5d9656':'#ffd367';g.beginPath();g.ellipse(o.x+o.w*.5,o.y+18,o.w*.6,28,0,0,7);g.fill()}}function birdDraw(){let x0=bird.x*W,y0=bird.y,w=.5+Math.sin(t*15)*.5;g.save();g.translate(x0,y0);g.fillStyle='#34263d';g.beginPath();g.ellipse(0,5,18,23,0,0,7);g.fill();g.beginPath();g.moveTo(-9,-3);g.quadraticCurveTo(-35,-22-8*w,-47,-8-15*w);g.quadraticCurveTo(-33,8,-10,10);g.closePath();g.fill();g.beginPath();g.moveTo(9,-3);g.quadraticCurveTo(35,-22-8*w,47,-8-15*w);g.quadraticCurveTo(33,8,10,10);g.closePath();g.fill();g.strokeStyle='#ff8fbb';g.lineWidth=3;g.beginPath();g.moveTo(-12,6);g.lineTo(-39,-6);g.moveTo(12,6);g.lineTo(39,-6);g.stroke();g.fillStyle='#261d30';g.beginPath();g.arc(0,-11,16,0,7);g.fill();g.fillStyle='white';g.beginPath();g.arc(-6,-11,4,0,7);g.arc(6,-11,4,0,7);g.fill();g.fillStyle='#261628';g.beginPath();g.arc(-5,-10,2,0,7);g.arc(7,-10,2,0,7);g.fill();g.fillStyle='#ff9b57';g.beginPath();g.moveTo(15,-2);g.lineTo(28,2);g.lineTo(15,7);g.fill();g.restore()}function draw(){let k=Math.floor(dist/420)%5;bg(k);obs.forEach(drawObs);bits.forEach(p=>{g.globalAlpha=Math.max(0,p.life);if(p.k===2){g.strokeStyle='rgba(255,255,255,.72)';g.lineWidth=2;g.beginPath();g.moveTo(p.x,p.y);g.quadraticCurveTo(p.x-p.len*.45,p.y-2,p.x-p.len,p.y+2);g.stroke()}else{g.fillStyle='#ff9dc5';g.fillRect(p.x,p.y,3,3)}});g.globalAlpha=1;birdDraw()}function loop(ts){let dt=Math.min(.033,(ts-last)/1000||.016);last=ts;if(st==='play')update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function down(e){e.preventDefault();if(st==='menu'||st==='over')start();hold=1}function up(){hold=0}addEventListener('pointerdown',down,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up);addEventListener('blur',up);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();down(e)}});addEventListener('keyup',e=>{if(e.code==='Space')up()});document.getElementById('go').onclick=start;document.getElementById('again').onclick=start;B.textContent='BEST '+best+' m'})();</script></body></html>
