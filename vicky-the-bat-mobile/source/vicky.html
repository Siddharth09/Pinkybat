html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#152036;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;z-index:5;display:flex;justify-content:space-between;color:#fff;pointer-events:none}
#score{font-size:50px;font-weight:1000;line-height:.85;letter-spacing:-2px;text-shadow:0 3px 7px #0007}

#city{margin-top:6px;font-size:10px;font-weight:1000;letter-spacing:2px;text-shadow:0 2px 5px #0008}
#pill{background:#152036ad;padding:9px 12px;border-radius:999px;font-size:10px;font-weight:1000;align-self:flex-start}
.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;color:#fff;background:linear-gradient(#15203605,#152036bf)}
.hidden{display:none!important}
.title{font-size:clamp(52px,15vw,92px);line-height:.82;font-weight:1000;letter-spacing:-5px;text-shadow:0 9px 22px #0007}
.title span{color:#ff79ae}
.mark{font-size:84px;margin-bottom:16px}
#gameover .scoreBig{font-size:80px;font-weight:1000;color:#ff9fc8}
button{border:0;border-radius:999px;padding:14px 34px;margin:5px;background:#ff6fa8;color:#fff;font-size:18px;font-weight:1000;box-shadow:0 7px #b13d6d}
#share{background:#fff;color:#ff4f93;box-shadow:0 6px #d7c7cf}
.note{font-size:12px;color:#fff9;margin:10px 0}
</style>
</head>

    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (state !== 'play' && state !== 'crash') bat.y = H * 0.5;
  }

  function currentCity() { return cities[cityIndex]; }
  function difficulty() { return Math.min(1, distance / 4200); }
  function forwardSpeed() {
    // Start fast, then continuously and smoothly accelerate throughout the run.
    // The curve is deliberately gradual so the player feels the pressure build.
    const timeBoost = t * 1.35;
    const distanceBoost = distance * 0.055;
    return Math.min(525, 160 + timeBoost + distanceBoost);
  }

    bat.y = H * 0.5;
    bat.vy = 0;
    scoreEl.innerHTML = '0<small> m</small>'; document.getElementById('heartScore').textContent='♥ 0'; document.getElementById('heartProgress').textContent='0/300';
    cityEl.textContent = currentCity().name;
  }

  function beginCrash() {
    if (state !== 'play') return;
    state = 'crash';
    holding = false;
    crashTime = 0;
    crashVelocity = -190;
    crashRotation = 0;
    screenShake = 0.55;
    impactFlash = 0.55;
    for (let i = 0; i < 44; i++) {
      particles.push({
        x:bat.x * W,
        y:bat.y,
        vx:-220 + Math.random() * 440,
        vy:-270 + Math.random() * 320,
        life:0.75 + Math.random() * 0.55,
        size:2 + Math.random() * 5
      });
    }
  }

  function finishRun() {
    const score = Math.floor(distance);
    const isNewBest = score > best;
    if (isNewBest) {
      best = score;
      localStorage.setItem('vickyBatBestFixed', String(best));
    }
    finalEl.textContent = String(score);
    lastCityEl.textContent = 'LAST CITY: ' + currentCity().name;
    newBestEl.textContent = isNewBest ? 'NEW BEST!' : '';
    pillEl.textContent = 'BEST ' + best + ' m';
    state = 'over';
    gameover.classList.remove('hidden');
  }

  function flap() {
    bat.vy = Math.max(-280, bat.vy - 106);
    bat.flapPhase = 0.18;
    for (let i = 0; i < 3; i++) {
      wind.push({x:bat.x*W-18, y:bat.y+Math.random()*12, vx:-50-Math.random()*30, vy:(Math.random()-.5)*18, life:.55, len:18+Math.random()*28});
    }
  }

  function updateCity() {
    cityTime += 1 / 60;
    if (cityTime >= 9) {
      cityTime = 0;
      if(cityIndex<cities.length-1)cityIndex++;
      weatherTime = 0;
      plane = {x:-280, y:60 + Math.random() * 50, flag:currentCity().flag};
      impactFlash = 0.12;
    }
    cityEl.textContent = currentCity().name;
  }

  function chooseWeather(dt) {
    weatherTime -= dt;
    if (weatherTime <= 0) {
      const list = currentCity().weather;
      weather = list[Math.floor(Math.random()*list.length)];
      weatherTime = 5 + Math.random()*4;
    }
  }

  function spawnObstacle() {
    const d = difficulty();
    const gap = Math.max(155, Math.min(H*0.48, 300-d*120));
    const gy = H*0.14 + Math.random()*Math.max(10, H*0.70-gap);
    const w = Math.max(52, Math.min(110, W*(0.12+0.055*d)));
    const pool = ['eiffel','statue','bigben','burj','sleigh','giraffe','volcano','skyscraper','bridge','charles','hallgrim','indiaGate','goldengate','parliament'];
    const type = pool[Math.floor(Math.random()*pool.length)];
    obstacles.push({x:W+50,y:0,w,h:gy,type},{x:W+50,y:gy+gap,w,h:H-gy-gap,type});
  }
  function hit(o) {
    const px = bat.x * W;
    const py = bat.y;
    // Use an inset collision box so thin landmarks (phone boxes, hydrants,
    // towers, etc.) don't behave like giant invisible rectangles.
    const narrowTypes = ['eiffel','statue','bigben','burj','giraffe','hallgrim','indiaGate','goldengate','parliament'];
    const isNarrow = narrowTypes.includes(o.type);
    const insetX = isNarrow ? Math.min(20, o.w * 0.28) : Math.min(14, o.w * 0.18);
    const insetY = isNarrow ? Math.min(14, o.h * 0.09) : Math.min(10, o.h * 0.07);
    const left = o.x + insetX;
    const right = o.x + o.w - insetX;
    const top = o.y + insetY;
    const bottom = o.y + o.h - insetY;
    if (right <= left || bottom <= top) return false;
    const rx = Math.max(left, Math.min(px, right));
    const ry = Math.max(top, Math.min(py, bottom));
    const hitRadius = bat.r * (isNarrow ? 0.54 : 0.59);
    return (px-rx)*(px-rx) + (py-ry)*(py-ry) < hitRadius*hitRadius;
  }

  function cityHasWater(){
    return new Set([
      'NEW YORK','SYDNEY','LONDON','AMSTERDAM','RIO DE JANEIRO','SAN FRANCISCO',
      'BUDAPEST','LIMA','MANILA','QUEENSTOWN','ISTANBUL','LISBON','COPENHAGEN',
      'STOCKHOLM','OSLO','HELSINKI','ZURICH','GENEVA','MONACO','BELGRADE',
      'LJUBLJANA','BRATISLAVA','MALTA','VALLETTA','PALERMO','NAPLES','VENICE',
      'FLORENCE','GENOA','MARSEILLE','LYON','BORDEAUX','VALENCIA','PORTO',
      'LIVERPOOL','GLASGOW','AKUREYRI','TROMSO','BERGEN','INTERLAKEN','WROCLAW',
      'BUSAN','HANOI','HO CHI MINH CITY','SINGAPORE','JAKARTA','BALI','DELFT',
      'ROTTERDAM','BRUGES','CAPE TOWN','CASABLANCA','LAGOS','ZANZIBAR','MUSCAT',
      'DOHA','ABU DHABI','TEL AVIV','TBILISI','MUMBAI','COLOMBO','PERTH',
      'MELBOURNE','BRISBANE','AUCKLAND','CHRISTCHURCH'
    ]).has(currentCity().name);
  }

  function update(dt) {
    t += dt;
    const cityGroup = Math.floor(cityIndex / 5);
    const baseSpeed = 175 + cityGroup * 35;
    const timeBoost = t * (1.35 + cityGroup * 0.04);
    const distanceBoost = distance * (0.055 + cityGroup * 0.012);
    const speedCap = 560 + cityGroup * 30;
    const sp = Math.min(speedCap, baseSpeed + timeBoost + distanceBoost);
    worldScroll += sp * dt;
    distance += sp * dt * 0.055;

    if (holding) flap();
    bat.vy += 790 * dt;
    bat.vy *= 0.994;
    bat.y += bat.vy * dt;
    bat.flapPhase = Math.max(0, bat.flapPhase - dt);
    if (bat.y < bat.r) {
      bat.y = bat.r;
      bat.vy = Math.max(0, bat.vy);
      if (t > 1.0) return beginCrash();
    }
    if (bat.y > H - bat.r) {
      bat.y = H - bat.r;
      bat.vy = Math.min(0, bat.vy);
      if (t > 1.0) return beginCrash();
    }

    cityTime += dt;
    if (cityTime >= 9) {
      cityTime = 0;
      if(cityIndex<cities.length-1)cityIndex++;
      weatherTime = 0;
    }
    cityEl.textContent = currentCity().name;
    chooseWeather(dt);

    spawnTime -= dt;
    if (spawnTime <= 0) {
      spawnObstacle();
      spawnTime = Math.max(0.9, 1.65 - difficulty()*0.55 + Math.random()*0.25);
    }
    heartPathPhase += dt*1.8;
    if (Math.random() < dt*0.42 && hearts.length < 5) {
      const lane = hearts.length % 3;
      const zigY = H*(0.38 + lane*0.10) + Math.sin(heartPathPhase*1.15 + lane)*H*0.035;
      hearts.push({x:W+70+lane*24,y:zigY,phase:Math.random()*6.28,r:13,lane});
    }
    for (let i=hearts.length-1;i>=0;i--) {
      const h=hearts[i];
      h.x-=sp*dt;
      h.phase+=dt*5;
      h.y += Math.sin(heartPathPhase*1.7 + h.lane*1.4)*0.35;
      const dx=bat.x*W-h.x,dy=bat.y-h.y,rr=bat.r*.70+h.r*1.15;
      if(dx*dx+dy*dy<rr*rr){
        hearts.splice(i,1);
        heartCount++;
        for(let j=0;j<16;j++){
          const a=(Math.PI*2*j)/16 + Math.random()*.18;
          const v=70+Math.random()*90;
          heartBursts.push({x:h.x,y:h.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.58,size:3+Math.random()*3});
        }
      } else if(h.x < -50) hearts.splice(i,1);
    }

    // Occasional airborne obstacles. These move more slowly than landmarks
    // and use compact circular hit areas matching their visible shapes.
    skyGuestTimer -= dt;
    if (skyGuestTimer <= 0 && skyGuests.length < 2) {
      const type = Math.random() < 0.58 ? 'balloon' : 'parachute';
      const r = type === 'balloon' ? Math.max(24,Math.min(34,W*.055)) : Math.max(19,Math.min(27,W*.043));
      // Spawn well away from Vicky's current position and never in the low
      // start lane. Parachutes are especially constrained because their body
      // hangs below the canopy.
      const minY = type === 'parachute' ? H*.18 : H*.16;
      const maxY = type === 'parachute' ? H*.47 : H*.56;
      let y = minY + Math.random()*(maxY-minY);
      const batY = bat.y;
      if (Math.abs(y-batY) < H*.20) {
        y = batY < H*.40 ? Math.min(maxY,batY+H*.24) : Math.max(minY,batY-H*.24);
      }
      skyGuests.push({type,x:W+r+35,y,r,bob:Math.random()*6.28,variant:Math.floor(Math.random()*4),age:0});
      skyGuestTimer = 5.5 + Math.random()*6.5;
    }
    for(let i=skyGuests.length-1;i>=0;i--){
      const g=skyGuests[i];
      g.x -= sp*dt*.72;
      g.bob += dt*1.8;
      g.age = (g.age||0) + dt;
      const gy=g.y+Math.sin(g.bob)*5;
      // Match collision to the visible object. For parachutes, collide near
      // the canopy/person cluster rather than an oversized invisible circle.
      const hitY = g.type==='parachute' ? gy + g.r*.35 : gy;
      const dx=bat.x*W-g.x,dy=bat.y-hitY;
      const rr=bat.r*.54+g.r*(g.type==='balloon'?.62:.46);
      // No airborne-object collision during the opening seconds of a run,
      // and never before a newly spawned guest has actually entered the screen.
      if(t>2.5 && g.age>.7 && g.x < W-g.r*.15 && dx*dx+dy*dy<rr*rr) return beginCrash();
      if(g.x+g.r*2<-80) skyGuests.splice(i,1);
    }

    // Boats are visual ambience at the bottom only and never collide with Vicky.
    boatTimer -= dt;
    if(cityHasWater()){
      if(boatTimer<=0 && boats.length<2){
        boats.push({x:W+90,y:H*(.89+Math.random()*.045),scale:.75+Math.random()*.45,type:Math.random()<.55?'sail':'ferry'});
        boatTimer=6+Math.random()*8;
      }
      for(let i=boats.length-1;i>=0;i--){
        boats[i].x-=sp*dt*.42;
        if(boats[i].x<-140)boats.splice(i,1);
      }
    }else{
      boats.length=0;
      boatTimer=Math.max(boatTimer,2);
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= sp * dt;
      if (o.x + o.w < -120) obstacles.splice(i,1);
      else if (t > 1.5 && hit(o)) return beginCrash();
    }

    // Plane: deliberately moderate, consistent speed. It must fully cross, exit,
    // then re-enter from the left. It never collides and never affects gameplay.
    const planeSpeed = 100;
    plane.x += planeSpeed * dt;

    // The banner extends ~190 px to the LEFT of plane.x; the aircraft nose
    // extends ~35 px to the RIGHT. We deliberately wait an extra 80 px so
    // the whole composition visibly flies out rather than popping away.
    const planeSpawnX = -230;
    const planeResetX = W + 120;

    // Change flags by screen progress without ever moving/resetting the aircraft.
    const visibleProgress = Math.max(0, Math.min(0.9999, (plane.x - planeSpawnX) / (planeResetX - planeSpawnX)));
    const flagStage = Math.min(3, Math.floor(visibleProgress * 4));
    plane.flagIndex = (cityIndex + flagStage) % cities.length;
    plane.flag = cities[plane.flagIndex].flag;

    // This is the ONLY in-game plane reset.
    if (plane.x > planeResetX) {
      plane.x = planeSpawnX;
      plane.y = 58 + Math.random() * 26;
      plane.flagIndex = cityIndex;
      plane.flag = cities[plane.flagIndex].flag;
    }

    if (Math.random() < dt * 8) {
      wind.push({x:bat.x*W-18,y:bat.y+8,vx:-35,vy:(Math.random()-.5)*14,life:.6,len:16+Math.random()*24});
    }
    for (let i = wind.length - 1; i >= 0; i--) {
      const p = wind[i]; p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt;
      if (p.life <= 0) wind.splice(i,1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 70*dt;
      if (p.life <= 0) particles.splice(i,1);
    }
    for(let i=heartBursts.length-1;i>=0;i--){
      const p=heartBursts[i];
      p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;
      if(p.life<=0)heartBursts.splice(i,1);
    }
    scoreEl.innerHTML = Math.floor(distance) + '<small> m</small>';
    document.getElementById('heartScore').textContent='♥ ' + heartCount;
    document.getElementById('heartProgress').textContent=heartCount+'/300';

  }

  function updateCrash(dt) {
    crashTime += dt;
    crashVelocity += 1150 * dt;
    bat.y += crashVelocity * dt;
    crashRotation += dt * 8;
    screenShake *= 0.92;
    impactFlash = Math.max(0, impactFlash - dt);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 420*dt;
      if (p.life <= 0) particles.splice(i,1);
    }
    if (crashTime > 1.35 || bat.y > H + 90) finishRun();
  }

  function gradient(top,bottom) {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,top); g.addColorStop(1,bottom);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }

    // Main suspension cable: anchor -> tower -> deep central parabola -> tower -> anchor.
    ctx.strokeStyle='#c84f3b';ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(W*.02,H*.50);
    ctx.quadraticCurveTo(W*.12,H*.39,L,towerTop);
    ctx.quadraticCurveTo(W*.475,H*.54,R,towerTop);
    ctx.quadraticCurveTo(W*.86,H*.39,W*.98,H*.50);
    ctx.stroke();

    // Secondary cable line gives the bridge its recognizable depth.
    ctx.strokeStyle='#df6850';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(W*.02,H*.52);
    ctx.quadraticCurveTo(W*.12,H*.41,L,towerTop+5);
    ctx.quadraticCurveTo(W*.475,H*.555,R,towerTop+5);
    ctx.quadraticCurveTo(W*.86,H*.41,W*.98,H*.52);
    ctx.stroke();

    // Straight vertical suspenders — no radial spokes.
    ctx.lineWidth=1.5;
    for(let i=1;i<23;i++){
      const u=i/23,px=W*.02+u*W*.96;
      let cy;
      if(px<L){
        const q=(px-W*.02)/(L-W*.02); cy=H*.50+(towerTop-H*.50)*q*q;
      }else if(px<R){
        const q=(px-L)/(R-L); cy=towerTop+(H*.54-towerTop)*4*q*(1-q);
      }else{
        const q=(px-R)/(W*.98-R); cy=towerTop+(H*.50-towerTop)*q*q;
      }
      ctx.beginPath();ctx.moveTo(px,cy);ctx.lineTo(px,deck);ctx.stroke();
    }

    // Road deck and underside truss.
    ctx.fillStyle='#384d56';ctx.fillRect(0,deck,W,8);
    ctx.strokeStyle='#6a4b40';ctx.lineWidth=1;
    for(let x=0;x<W;x+=18){ctx.beginPath();ctx.moveTo(x,deck+8);ctx.lineTo(x+18,deck+20);ctx.moveTo(x+18,deck+8);ctx.lineTo(x,deck+20);ctx.stroke();}
    ctx.fillStyle='#334650';ctx.fillRect(0,deck+19,W,4);

    // Fog ribbons around the bridge/headlands.
    ctx.fillStyle='rgba(247,249,247,.22)';ctx.fillRect(0,H*.39,W*.18,H*.06);ctx.fillRect(W*.78,H*.43,W*.22,H*.055);
  }

function drawParis() {
    gradient('#b9e1ee','#f8efe0');
    const ground=H*.81;
    ctx.fillStyle='#b7d78a';ctx.fillRect(0,ground,W,H-ground);

    // Haussmann skyline: pale limestone facades and slate/red mansard roofs.
    for(let i=0;i<7;i++){
      const x=i*150-(worldScroll*.055%150),bw=128;
      ctx.fillStyle=['#d9c8b8','#cfbaaa','#e4d5c7'][i%3];ctx.fillRect(x,H*.61,bw,H*.20);
      ctx.fillStyle=['#7e6865','#9a5149','#6f6464'][i%3];

      for(let r=0;r<3;r++)for(let k=0;k<4;k++)ctx.fillRect(x+12+k*28,H*(.64+r*.052),12,16);
    }

    // Seine ribbon and stone embankment.
    ctx.fillStyle='#77afbd';ctx.fillRect(0,H*.765,W,H*.035);
    ctx.fillStyle='#b49b80';ctx.fillRect(0,H*.755,W,5);

    // Eiffel Tower: recognizable iron silhouette with arched base and lattice.
    const cx=W*.53,base=H*.79,top=H*.115,tw=Math.min(W*.245,205);
    ctx.strokeStyle='#6c5a4e';ctx.lineCap='round';

    // Four tapered legs / outer profile.
    ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(cx,top);ctx.quadraticCurveTo(cx-tw*.10,H*.42,cx-tw*.50,base);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,top);ctx.quadraticCurveTo(cx+tw*.10,H*.42,cx+tw*.50,base);ctx.stroke();
    ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(cx,top+H*.08);ctx.quadraticCurveTo(cx-tw*.04,H*.45,cx-tw*.29,base);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,top+H*.08);ctx.quadraticCurveTo(cx+tw*.04,H*.45,cx+tw*.29,base);ctx.stroke();

    // Characteristic arch between the legs.
    ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(cx,base+H*.005,tw*.30,Math.PI,0);ctx.stroke();

    // Observation platforms.
    ctx.fillStyle='#655448';
    const levels=[
      [H*.615,tw*.38,8],
      [H*.405,tw*.20,7],
      [H*.255,tw*.10,5]
    ];
    levels.forEach(([y,half,h])=>ctx.fillRect(cx-half,y,half*2,h));

    // Dense iron cross-bracing inside the tower.
    ctx.strokeStyle='#7a6758';ctx.lineWidth=1.3;
    for(let i=0;i<10;i++){
      const y1=H*(.20+i*.052),y2=y1+H*.095;
      const f1=(y1-top)/(base-top),f2=(y2-top)/(base-top);
      const a1=tw*(.055+.42*f1),a2=tw*(.055+.42*f2);
      ctx.beginPath();ctx.moveTo(cx-a1,y1);ctx.lineTo(cx+a2,y2);ctx.moveTo(cx+a1,y1);ctx.lineTo(cx-a2,y2);ctx.stroke();
    }

    // Top cabin, antenna and beacon.
    ctx.fillStyle='#5e5046';ctx.fillRect(cx-6,H*.145,12,H*.045);
    ctx.fillRect(cx-2,top-H*.055,4,H*.075);
    ctx.fillStyle='#d6a64c';ctx.beginPath();ctx.arc(cx,top-H*.055,2.5,0,Math.PI*2);ctx.fill();

    // Arc de Triomphe and clipped tree rows.
    ctx.fillStyle='#c8ad8e';ctx.fillRect(W*.79,H*.63,W*.12,H*.14);
    ctx.fillStyle='#756252';ctx.beginPath();ctx.arc(W*.85,H*.69,17,Math.PI,0);ctx.fill();ctx.fillRect(W*.833,H*.69,W*.034,H*.08);
    for(let side=-1;side<=1;side+=2)for(let i=0;i<5;i++){

    }

    ctx.beginPath();ctx.moveTo(L,deck);ctx.bezierCurveTo(W*.23,H*.39,W*.34,archTop,W*.50,archTop);ctx.bezierCurveTo(W*.66,archTop,W*.77,H*.39,R,deck);ctx.stroke();
    ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(W*.095,deck);ctx.bezierCurveTo(W*.25,H*.43,W*.36,H*.35,W*.50,H*.35);ctx.bezierCurveTo(W*.64,H*.35,W*.75,H*.43,W*.905,deck);ctx.stroke();

    // Neat vertical hangers between arch and roadway (no radial spokes).
    ctx.strokeStyle='#405963';ctx.lineWidth=1.7;
    for(let i=1;i<15;i++){
      const u=i/15,px=L+(R-L)*u;
      const archY=archTop+(deck-archTop)*Math.pow(Math.abs(2*u-1),1.72);
      ctx.beginPath();ctx.moveTo(px,archY);ctx.lineTo(px,deck);ctx.stroke();
    }
    // Deck, roadway and tiny traffic.
    ctx.fillStyle='#304852';ctx.fillRect(W*.045,deck,W*.91,8);
    ctx.fillStyle='#d7d4c6';
    for(let i=0;i<6;i++)ctx.fillRect(W*(.20+i*.10),deck+2,W*.025,2);

    // Sydney Opera House in front: podium plus overlapping shell vaults.
    const podY=H*.665;
    ctx.fillStyle='#e5e6df';ctx.fillRect(W*.245,podY,W*.47,H*.035);
    ctx.fillStyle='#f8fbf7';
    const shells=[
      [.27,.085,.205], [.335,.105,.285], [.42,.115,.345],
      [.515,.105,.285], [.60,.085,.205]
    ];
    shells.forEach(([bx,bw,hh])=>{
      const x=W*bx,w=W*bw,y=podY;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.bezierCurveTo(x+w*.10,y-H*hh*.55,x+w*.22,y-H*hh*.94,x+w*.48,y-H*hh);
      ctx.bezierCurveTo(x+w*.56,y-H*hh*.58,x+w*.74,y-H*hh*.18,x+w,y);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='#d2d8d4';ctx.lineWidth=1;ctx.stroke();
    });
    // Dark glazing between the sails.
    ctx.fillStyle='#41666a';
    ctx.beginPath();ctx.moveTo(W*.34,podY);ctx.lineTo(W*.42,H*.61);ctx.lineTo(W*.48,podY);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(W*.51,podY);ctx.lineTo(W*.58,H*.615);ctx.lineTo(W*.64,podY);ctx.closePath();ctx.fill();

    // Foreground ferry and sailboat.
    ctx.fillStyle='#f8f8f2';ctx.fillRect(W*.76,H*.82,W*.10,5);
    ctx.fillStyle='#e36d45';ctx.beginPath();ctx.moveTo(W*.14,H*.84);ctx.lineTo(W*.20,H*.84);ctx.lineTo(W*.17,H*.77);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#7b5c49';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.17,H*.84);ctx.lineTo(W*.17,H*.745);ctx.stroke();
  }

  function drawLondon(){
    gradient('#8fb3cf','#ecf3f6');
    ctx.fillStyle='#55707f';ctx.fillRect(0,H*.82,W,H*.18);

    // Palace of Westminster.
    ctx.fillStyle='#6e7d86';ctx.fillRect(W*.18,H*.53,W*.60,H*.29);
    for(let i=0;i<10;i++){ctx.fillStyle='#81909a';ctx.fillRect(W*(.20+i*.058),H*.45,W*.038,H*.09);}
    // Elizabeth Tower / Big Ben.
    const bx=W*.57,top=H*.19,base=H*.82;
    ctx.fillStyle='#5f7078';ctx.fillRect(bx,top,W*.09,base-top);
    ctx.fillStyle='#e9dfca';ctx.beginPath();ctx.arc(bx+W*.045,H*.37,18,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#58666d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(bx+W*.045,H*.37,18,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx+W*.045,H*.37-12);ctx.lineTo(bx+W*.045,H*.37+2);ctx.moveTo(bx+W*.045,H*.37);ctx.lineTo(bx+W*.058,H*.37-7);ctx.stroke();
    ctx.fillStyle='#52636b';ctx.beginPath();ctx.moveTo(bx+W*.045,top-H*.10);ctx.lineTo(bx,top);ctx.lineTo(bx+W*.09,top);ctx.closePath();ctx.fill();
    // Westminster Bridge + London Eye.
    ctx.strokeStyle='#72868f';ctx.lineWidth=4;ctx.beginPath();ctx.arc(W*.20,H*.70,28,Math.PI,0);ctx.stroke();
    ctx.fillStyle='#b84138';ctx.fillRect(W*.10,H*.65,W*.05,H*.16);
  }

  function drawNewYork(){
    gradient('#7996b8','#eef6ff');ctx.fillStyle='#273a50';ctx.fillRect(0,H*.82,W,H*.18);const xs=[.01,.14,.28,.42,.58,.74,.88];xs.forEach((p,i)=>{const bw=W*(.075+(i%3)*.025),bh=H*(.18+((i*17)%28)/100),top=H*.82-bh;ctx.fillStyle=['#30465f','#445b71','#21374d'][i%3];ctx.fillRect(W*p,top,bw,bh);ctx.fillStyle='#ffd76a';for(let y=top+12;y<top+bh-7;y+=24)for(let x=W*p+8;x<W*p+bw-6;x+=18)ctx.fillRect(x,y,7,9);});ctx.fillStyle='#4c8e82';ctx.beginPath();ctx.arc(W*.58,H*.58,13,0,Math.PI*2);ctx.fill();ctx.fillRect(W*.565,H*.58,9,H*.16);
  }

  function drawRome(){
    gradient('#eeaf76','#ffe4c5');ctx.fillStyle='#c6915e';ctx.fillRect(0,H*.82,W,H*.18);ctx.fillStyle='#af7953';ctx.beginPath();ctx.arc(W*.55,H*.62,78,Math.PI,0);ctx.fill();ctx.fillRect(W*.47,H*.62,W*.16,H*.20);ctx.fillStyle='#c6aa78';for(let i=0;i<5;i++)ctx.fillRect(W*(.10+i*.12),H*.61,W*.035,H*.20);

  function drawBackground() {
    const c = currentCity().name;
    if(c==='NEW YORK')drawNewYork();
    else if(c==='PRAGUE')drawPrague();
    else if(c==='PARIS')drawParis();
    else if(c==='DUBAI')drawDubai();
    else if(c==='SYDNEY')drawSydney();
    else if(c==='LONDON')drawLondon();
    else if(c==='AMSTERDAM')drawAmsterdam();
    else if(c==='REYKJAVIK')drawReykjavik();
    else if(c==='AGRA')drawAgra();
    else if(c==='RIO DE JANEIRO')drawRio();
    else if(c==='SAN FRANCISCO')drawSanFrancisco();
    else if(c==='MEXICO CITY')drawMexicoCity();
    else if(c==='NORTH POLE')drawNorthPole();
    else if(c==='ANTARCTICA')drawAntarctica();
    else if(c==='BUDAPEST')drawBudapest();
    else drawGenericCity(c);
    if(weather==='rain')drawRain();
    if(weather==='snow')drawSnow();
    drawClouds();
    drawBalloon();
  }

  function drawGenericCity(c){
    gradient(c.palette[0],c.palette[1]);
    const ground=H*.81, lm=c.landmarks||[];

    // Each destination gets its own street/terrain rhythm, derived from its name
    // so cities no longer share an identical generic skyline.
    const seed=[...c.name].reduce((a,ch)=>a+ch.charCodeAt(0),0);
    ctx.fillStyle=(['CAIRO','MARRAKESH','MUSCAT','DOHA','ABU DHABI','DUBAI'].includes(c.name))?'#c99561':
                  (['REYKJAVIK','AKUREYRI','TROMSO','ZERMATT','INTERLAKEN'].includes(c.name))?'#dfeef2':
                  '#70818a';
    ctx.fillRect(0,ground,W,H-ground);
    for(let i=0;i<8;i++){
      const x=i*135-(worldScroll*(.035+(seed%4)*.006)%135);
      const bh=H*(.075+(((seed+i*31)%20)/100));
      ctx.fillStyle=`rgba(${70+(seed+i*9)%45},${77+(seed+i*7)%40},${80+(seed+i*5)%35},.38)`;
      ctx.fillRect(x,ground-bh,100,bh);
    }

    function monument(type,x,base,w,h){
      ctx.save();
      // Famous towers / vertical monuments
      if(['skytree','tower','namsan','monas','lantern','spire','freedom','jet','giralda','belfry','sky'].includes(type)){
        ctx.fillStyle='#667985';ctx.fillRect(x-w*.045,base-h*.78,w*.09,h*.78);
        ctx.beginPath();ctx.moveTo(x,base-h);ctx.lineTo(x-w*.09,base-h*.78);ctx.lineTo(x+w*.09,base-h*.78);ctx.closePath();ctx.fill();
        ctx.fillStyle='#d7b04c';ctx.beginPath();ctx.arc(x,base-h,3,0,Math.PI*2);ctx.fill();
      }
      // Domed religious / civic landmarks
      else if(['mosque','cathedral','basilica','church','duomo','dome','wat','grandpalace','palace','royalpalace','athenaeum','schonbrunn'].includes(type)){
        ctx.fillStyle='#d7b98f';ctx.fillRect(x-w*.34,base-h*.52,w*.68,h*.52);
        ctx.fillStyle='#8c735c';ctx.beginPath();ctx.arc(x,base-h*.52,w*.21,Math.PI,0);ctx.fill();
        ctx.fillStyle='#b99872';
        ctx.fillRect(x-w*.31,base-h*.73,w*.045,h*.73);ctx.fillRect(x+w*.265,base-h*.73,w*.045,h*.73);
        ctx.beginPath();ctx.moveTo(x-w*.287,base-h*.86);ctx.lineTo(x-w*.34,base-h*.73);ctx.lineTo(x-w*.235,base-h*.73);ctx.closePath();ctx.fill();
        ctx.beginPath();ctx.moveTo(x+w*.287,base-h*.86);ctx.lineTo(x+w*.235,base-h*.73);ctx.lineTo(x+w*.34,base-h*.73);ctx.closePath();ctx.fill();
      }
      // Castles, forts, historic gates
      else if(['castle','fortress','fort','gate','gates','redfort','brandenburg','wawel','yellowfort','kremlin','alcazar','oldcity'].includes(type)){
        ctx.fillStyle='#b89168';ctx.fillRect(x-w*.36,base-h*.48,w*.72,h*.48);
        for(let k=-1;k<=1;k++){ctx.fillRect(x+k*w*.25-w*.07,base-h*.70,w*.14,h*.70);ctx.beginPath();ctx.moveTo(x+k*w*.25,base-h*.86);ctx.lineTo(x+k*w*.25-w*.09,base-h*.70);ctx.lineTo(x+k*w*.25+w*.09,base-h*.70);ctx.closePath();ctx.fill();}
        ctx.fillStyle='#5f4c42';ctx.beginPath();ctx.arc(x,base-h*.20,w*.09,Math.PI,0);ctx.fill();ctx.fillRect(x-w*.09,base-h*.20,w*.18,h*.20);
      }
      // Bridges
      else if(['bridge','chain','erasmus','stonebridge','pontevecchio'].includes(type)){
        ctx.strokeStyle='#596e78';ctx.lineWidth=7;ctx.beginPath();ctx.arc(x,base,w*.50,Math.PI,0);ctx.stroke();
        ctx.strokeStyle='#7f9097';ctx.lineWidth=1.5;for(let k=0;k<9;k++){const px=x-w*.42+k*w*.105;ctx.beginPath();ctx.moveTo(px,base);ctx.lineTo(px,base-h*.22*(1-Math.abs(k-4)/5));ctx.stroke();}
        if(type==='pontevecchio'){ctx.fillStyle='#b88d68';for(let k=0;k<5;k++)ctx.fillRect(x-w*.40+k*w*.16,base-h*.19,w*.13,h*.15);}
      }
      // Mountain / volcanic icons
      else if(['mountain','alps','andes','remarkables','matterhorn','arthurseat','tablemountain','vesuvius','hill'].includes(type)){
        ctx.fillStyle='#728f9e';ctx.beginPath();ctx.moveTo(x,base-h*.92);ctx.lineTo(x-w*.50,base);ctx.lineTo(x+w*.50,base);ctx.closePath();ctx.fill();
        ctx.fillStyle='#f7fafb';ctx.beginPath();ctx.moveTo(x,base-h*.92);ctx.lineTo(x-w*.14,base-h*.55);ctx.lineTo(x,base-h*.62);ctx.lineTo(x+w*.14,base-h*.55);ctx.closePath();ctx.fill();
      }
      // Waterfront / canal identities
      else if(['canal','harbor','bay','river','fjord','waterfront','coast','beach','marineDrive','corniche','port','sava','lake'].includes(type)){
        ctx.fillStyle='#4faec1';ctx.fillRect(x-w*.52,base-h*.20,w*1.04,h*.20);
        ctx.fillStyle='#a4775c';ctx.fillRect(x-w*.43,base-h*.47,w*.18,h*.27);ctx.fillRect(x-w*.18,base-h*.55,w*.19,h*.35);ctx.fillRect(x+w*.08,base-h*.42,w*.22,h*.22);
        ctx.fillStyle='#f5f1e6';ctx.beginPath();ctx.moveTo(x+w*.25,base-h*.12);ctx.lineTo(x+w*.42,base-h*.12);ctx.lineTo(x+w*.32,base-h*.30);ctx.closePath();ctx.fill();
      }
      // Distinct famous landmark silhouettes
      else if(type==='colosseum'){
        ctx.fillStyle='#b88f66';ctx.beginPath();ctx.ellipse(x,base-h*.26,w*.46,h*.27,0,Math.PI,0);ctx.lineTo(x+w*.46,base);ctx.lineTo(x-w*.46,base);ctx.closePath();ctx.fill();
        ctx.fillStyle='#6d594b';for(let k=-3;k<=3;k++){ctx.beginPath();ctx.arc(x+k*w*.11,base-h*.19,w*.035,Math.PI,0);ctx.fill();ctx.fillRect(x+k*w*.11-w*.035,base-h*.19,w*.07,h*.16);}
      } else if(type==='parthenon'){
        ctx.fillStyle='#d1b98e';ctx.fillRect(x-w*.40,base-h*.12,w*.80,h*.12);for(let k=0;k<7;k++)ctx.fillRect(x-w*.34+k*w*.11,base-h*.52,w*.045,h*.40);
        ctx.beginPath();ctx.moveTo(x,base-h*.75);ctx.lineTo(x-w*.43,base-h*.52);ctx.lineTo(x+w*.43,base-h*.52);ctx.closePath();ctx.fill();
      } else if(type==='sagrada'){
        ctx.fillStyle='#aa8c70';for(let k=-2;k<=2;k++){const xx=x+k*w*.13,hh=h*(.58+(.2-Math.abs(k)*.035));ctx.fillRect(xx-w*.035,base-hh,w*.07,hh);ctx.beginPath();ctx.moveTo(xx,base-hh-h*.13);ctx.lineTo(xx-w*.055,base-hh);ctx.lineTo(xx+w*.055,base-hh);ctx.closePath();ctx.fill();}
      } else if(type==='petronas'){
        ctx.fillStyle='#a9c0c9';for(const d of [-1,1]){ctx.fillRect(x+d*w*.13-w*.055,base-h*.78,w*.11,h*.78);for(let k=0;k<5;k++)ctx.fillRect(x+d*w*.13-w*.075,base-h*(.20+k*.12),w*.15,4);}
        ctx.fillRect(x-w*.13,base-h*.48,w*.26,5);
      } else if(type==='atomium'){
        ctx.strokeStyle='#8297a0';ctx.lineWidth=5;const pts=[[0,-.65],[-.28,-.35],[.28,-.35],[-.34,.05],[.34,.05],[0,.28]];for(const [a,b] of [[0,1],[0,2],[1,3],[2,4],[3,5],[4,5],[1,2]]){ctx.beginPath();ctx.moveTo(x+pts[a][0]*w,base+pts[a][1]*h);ctx.lineTo(x+pts[b][0]*w,base+pts[b][1]*h);ctx.stroke();}ctx.fillStyle='#a7bbc3';for(const [px,py] of pts){ctx.beginPath();ctx.arc(x+px*w,base+py*h,w*.07,0,Math.PI*2);ctx.fill();}
      } else if(type==='merlion'){
        ctx.fillStyle='#e8e4d7';ctx.beginPath();ctx.arc(x,base-h*.55,w*.13,0,Math.PI*2);ctx.fill();ctx.fillRect(x-w*.08,base-h*.48,w*.16,h*.40);ctx.strokeStyle='#7bc0d0';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+w*.11,base-h*.55);ctx.quadraticCurveTo(x+w*.35,base-h*.48,x+w*.48,base-h*.18);ctx.stroke();
      } else if(type==='littlemermaid'){
        ctx.fillStyle='#607d74';ctx.beginPath();ctx.arc(x,base-h*.55,w*.07,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x,base-h*.35,w*.09,h*.18,-.25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#72685d';ctx.beginPath();ctx.ellipse(x,base-h*.06,w*.25,h*.08,0,0,Math.PI*2);ctx.fill();
      } else if(type==='pagoda'||type==='temple'){
        ctx.fillStyle='#8c5a49';for(let k=0;k<4;k++){const yy=base-h*(.15+k*.16),ww=w*(.40-k*.065);ctx.fillRect(x-ww*.32,yy,ww*.64,h*.12);ctx.beginPath();ctx.moveTo(x-ww*.50,yy);ctx.lineTo(x,yy-h*.08);ctx.lineTo(x+ww*.50,yy);ctx.closePath();ctx.fill();}
      } else if(type==='wall'){
        ctx.fillStyle='#a88c69';ctx.fillRect(x-w*.48,base-h*.18,w*.96,h*.18);for(let k=-2;k<=2;k++){ctx.fillRect(x+k*w*.20-w*.06,base-h*.34,w*.12,h*.34);}
      } else if(type==='forbidden'){
        ctx.fillStyle='#a73f34';ctx.fillRect(x-w*.38,base-h*.34,w*.76,h*.34);ctx.fillStyle='#d6a44d';ctx.beginPath();ctx.moveTo(x-w*.48,base-h*.34);ctx.lineTo(x,base-h*.52);ctx.lineTo(x+w*.48,base-h*.34);ctx.closePath();ctx.fill();
      } else if(type==='marinabay'){
        ctx.fillStyle='#657985';for(let k=-1;k<=1;k++)ctx.fillRect(x+k*w*.19-w*.055,base-h*.58,w*.11,h*.58);ctx.fillStyle='#8fa8b0';ctx.beginPath();ctx.moveTo(x-w*.32,base-h*.60);ctx.quadraticCurveTo(x,base-h*.78,x+w*.32,base-h*.60);ctx.lineTo(x+w*.26,base-h*.53);ctx.lineTo(x-w*.26,base-h*.53);ctx.closePath();ctx.fill();
      } else if(type==='cube'){
        ctx.fillStyle='#e5b54b';ctx.save();ctx.translate(x,base-h*.38);ctx.rotate(Math.PI/4);ctx.fillRect(-w*.15,-w*.15,w*.30,w*.30);ctx.restore();
      } else if(type==='gondola'){
        ctx.fillStyle='#292d31';ctx.beginPath();ctx.moveTo(x-w*.35,base-h*.12);ctx.quadraticCurveTo(x,base,x+w*.35,base-h*.12);ctx.lineTo(x+w*.25,base-h*.04);ctx.lineTo(x-w*.28,base-h*.04);ctx.closePath();ctx.fill();ctx.strokeStyle='#5c493b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+w*.15,base-h*.10);ctx.lineTo(x+w*.28,base-h*.50);ctx.stroke();
      } else if(type==='jesus'){
        ctx.strokeStyle='#e8e3d7';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x,base-h*.68);ctx.lineTo(x,base-h*.20);ctx.moveTo(x-w*.30,base-h*.52);ctx.lineTo(x+w*.30,base-h*.52);ctx.stroke();ctx.fillStyle='#e8e3d7';ctx.beginPath();ctx.arc(x,base-h*.78,w*.08,0,Math.PI*2);ctx.fill();
      } else if(type==='pyramid'){
        ctx.fillStyle='#c99558';ctx.beginPath();ctx.moveTo(x,base-h*.82);ctx.lineTo(x-w*.48,base);ctx.lineTo(x+w*.48,base);ctx.closePath();ctx.fill();
      } else if(type==='sphinx'){
        ctx.fillStyle='#b98955';ctx.beginPath();ctx.ellipse(x,base-h*.15,w*.32,h*.13,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x-w*.18,base-h*.32,w*.11,0,Math.PI*2);ctx.fill();
      } else if(type==='palaceculture'){
        ctx.fillStyle='#9a876f';ctx.fillRect(x-w*.30,base-h*.52,w*.60,h*.52);ctx.fillRect(x-w*.07,base-h*.82,w*.14,h*.82);ctx.beginPath();ctx.moveTo(x,base-h);ctx.lineTo(x-w*.06,base-h*.82);ctx.lineTo(x+w*.06,base-h*.82);ctx.closePath();ctx.fill();
      } else if(type==='ferris'||type==='wheel'){
        ctx.strokeStyle='#8296a0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,base-h*.42,w*.30,0,Math.PI*2);ctx.stroke();for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.beginPath();ctx.moveTo(x,base-h*.42);ctx.lineTo(x+Math.cos(a)*w*.30,base-h*.42+Math.sin(a)*w*.30);ctx.stroke();}
      } else if(type==='dragon'){
        ctx.strokeStyle='#49735e';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x-w*.30,base-h*.18);ctx.quadraticCurveTo(x,base-h*.55,x+w*.30,base-h*.22);ctx.stroke();ctx.fillStyle='#49735e';ctx.beginPath();ctx.moveTo(x+w*.30,base-h*.22);ctx.lineTo(x+w*.18,base-h*.34);ctx.lineTo(x+w*.40,base-h*.31);ctx.closePath();ctx.fill();
      } else {
        // Bespoke civic block fallback with roof, windows and tower rather than a blank rectangle.
        ctx.fillStyle='#bc9977';ctx.fillRect(x-w*.34,base-h*.50,w*.68,h*.50);
        ctx.fillStyle='#765d4d';ctx.beginPath();ctx.moveTo(x-w*.40,base-h*.50);ctx.lineTo(x,base-h*.68);ctx.lineTo(x+w*.40,base-h*.50);ctx.closePath();ctx.fill();
        ctx.fillStyle='#ead7bd';for(let k=-2;k<=2;k++)ctx.fillRect(x+k*w*.12-w*.025,base-h*.34,w*.05,h*.10);
        ctx.fillStyle='#765d4d';ctx.fillRect(x-w*.035,base-h*.83,w*.07,h*.33);
      }
      ctx.restore();
    }

    lm.slice(0,2).forEach((type,j)=>monument(type,W*(.28+j*.44),ground,Math.min(W*.25,170),H*.40));
  }

  function drawClouds(){
    ctx.fillStyle='rgba(255,255,255,.62)';
    for(let i=0;i<5;i++){
      const x=(i*210-(worldScroll*.03%210));
      const y=52+(i%3)*40;
      ctx.beginPath();
      ctx.arc(x,y,17,0,Math.PI*2);
      ctx.arc(x+20,y-8,22,0,Math.PI*2);
      ctx.arc(x+43,y,16,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawRain(){ctx.strokeStyle='rgba(190,220,235,.38)';ctx.lineWidth=2;for(let i=0;i<85;i++){const x=(i*79+worldScroll)%W,y=(i*47+t*420)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+18);ctx.stroke();}}
  function drawSnow(){ctx.fillStyle='rgba(255,255,255,.82)';for(let i=0;i<55;i++){const x=(i*93+worldScroll*.24)%W,y=(i*51+t*30)%H;ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,Math.PI*2);ctx.fill();}}

    }
    else if(type==='volcano'){
      ctx.fillStyle='#675955';ctx.beginPath();ctx.moveTo(x+w*.50,y+h*.02);ctx.lineTo(x+w*.08,y+h);ctx.lineTo(x+w*.92,y+h);ctx.closePath();ctx.fill();
      ctx.fillStyle='#603029';ctx.beginPath();ctx.arc(x+w*.50,y+h*.07,w*.14,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ef6a3a';ctx.beginPath();ctx.moveTo(x+w*.48,y+h*.08);ctx.lineTo(x+w*.34,y-h*.06);ctx.lineTo(x+w*.45,y+h*.01);ctx.lineTo(x+w*.56,y-h*.03);ctx.lineTo(x+w*.54,y+h*.08);ctx.closePath();ctx.fill();
      ctx.fillStyle='#f4b246';ctx.beginPath();ctx.arc(x+w*.31,y+h*.07,4,0,Math.PI*2);ctx.arc(x+w*.67,y+h*.04,3,0,Math.PI*2);ctx.fill();
    }
    else if(type==='sleigh'){
      ctx.fillStyle='#b8464b';ctx.fillRect(x+w*.24,y+h*.47,w*.52,h*.20);
      ctx.strokeStyle='#f1d18d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x+w*.50,y+h*.60,w*.27,0,Math.PI);ctx.stroke();
      ctx.fillStyle='#e6ddd3';ctx.beginPath();ctx.arc(x+w*.22,y+h*.36,7,0,Math.PI*2);ctx.arc(x+w*.78,y+h*.36,7,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#805546';ctx.lineWidth=2;ctx.beginPath();
      ctx.moveTo(x+w*.25,y+h*.41);ctx.lineTo(x+w*.16,y+h*.20);
      ctx.moveTo(x+w*.78,y+h*.41);ctx.lineTo(x+w*.87,y+h*.20);ctx.stroke();
    }
    else {ctx.fillStyle='#c99e72';ctx.fillRect(x+w*.10,y+h*.40,w*.80,h*.60);}
    ctx.restore();
  }

  function drawBat(){
    const pinkRatio = heartCount < 3 ? heartCount*0.04 : Math.min(1, 0.12 + Math.pow((heartCount-3)/297, 0.72)*0.88);
    const bodyR = Math.round(28 + 115*pinkRatio);
    const bodyG = Math.round(38 + 55*pinkRatio);
    const bodyB = Math.round(48 + 90*pinkRatio);
    const wingR = Math.round(23 + 232*pinkRatio);
    const wingG = Math.round(31 + 85*pinkRatio);
    const wingB = Math.round(42 + 135*pinkRatio);
    const x=bat.x*W,y=bat.y;
    const flapPulse = bat.flapPhase > 0 ? bat.flapPhase / 0.18 : 0;
    const wingBeat = 0.5 + 0.5*Math.sin(t*13.5) + flapPulse*0.35;
    const verticalInfluence = Math.max(-1, Math.min(1, bat.vy/320));
    const wingLift = wingBeat*11 - verticalInfluence*7;
    const wingSweep = wingBeat*5 + verticalInfluence*3;
    ctx.save();ctx.translate(x,y);if(state==='crash')ctx.rotate(crashRotation);
    ctx.fillStyle=`rgb(${bodyR},${bodyG},${bodyB})`;ctx.beginPath();ctx.ellipse(0,5,18,24,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0c1218';ctx.beginPath();ctx.arc(0,-10,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f4f5f6';ctx.beginPath();ctx.moveTo(-12,-9);ctx.lineTo(-5,-26);ctx.lineTo(2,-19);ctx.lineTo(9,-26);ctx.lineTo(14,-8);ctx.lineTo(6,-2);ctx.lineTo(-1,-9);ctx.lineTo(-8,-2);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-11,4,0,Math.PI*2);ctx.arc(6,-10,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1e252d';ctx.beginPath();ctx.arc(-5,-10,2,0,Math.PI*2);ctx.arc(7,-9,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffb5d0';ctx.beginPath();ctx.arc(-5,-11,2,0,Math.PI*2);ctx.arc(6,-10,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff8eb8';ctx.beginPath();ctx.moveTo(14,-3);ctx.lineTo(27,2);ctx.lineTo(14,6);ctx.closePath();ctx.fill();
    ctx.fillStyle=`rgb(${Math.max(18,wingR)},${Math.max(24,wingG)},${Math.max(34,wingB)})`;ctx.beginPath();ctx.moveTo(-10,4);ctx.quadraticCurveTo(-34,-20-9*wingBeat,-48,-8+wingSweep);ctx.quadraticCurveTo(-34,10+wingLift,-10,13);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(10,4);ctx.quadraticCurveTo(34,-20-9*wingBeat,48,-8+wingSweep);ctx.quadraticCurveTo(34,10+wingLift,10,13);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#ff8eb9';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-12,7);ctx.lineTo(-39,-5-wingLift*.35);ctx.moveTo(12,7);ctx.lineTo(39,-5-wingLift*.35);ctx.stroke();if(pinkRatio>0.01){
      ctx.globalAlpha=0.08+0.18*pinkRatio;
      ctx.fillStyle='#ff6fa6';
      ctx.beginPath();ctx.arc(0,4,30+8*pinkRatio,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  function drawSkyGuests(){
    for(const g of skyGuests){
      const y=g.y+Math.sin(g.bob)*5;
      ctx.save();ctx.translate(g.x,y);
      if(g.type==='balloon'){
        const palettes=[['#d84f43','#f1c86c'],['#5a82c8','#e6aa55'],['#9a5ea8','#f0d1a1'],['#4c9b72','#e5c64c']];
        const [a,b]=palettes[g.variant%palettes.length],r=g.r;
        // Envelope with alternating curved panels.
        ctx.fillStyle=a;ctx.beginPath();ctx.ellipse(0,-r*.25,r,r*1.12,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=b;ctx.beginPath();ctx.ellipse(0,-r*.25,r*.38,r*1.10,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(70,50,40,.55)';ctx.lineWidth=1.2;
        ctx.beginPath();ctx.ellipse(0,-r*.25,r,r*1.12,0,0,Math.PI*2);ctx.stroke();
        // Ropes and basket.
        ctx.strokeStyle='#6d5140';ctx.beginPath();ctx.moveTo(-r*.32,r*.66);ctx.lineTo(-r*.20,r*1.12);ctx.moveTo(r*.32,r*.66);ctx.lineTo(r*.20,r*1.12);ctx.stroke();
        ctx.fillStyle='#8b613f';ctx.fillRect(-r*.25,r*1.08,r*.50,r*.30);
      }else{
        const r=g.r;
        const colors=['#d74e48','#587fc0','#58a06e','#d89c42'];
        ctx.fillStyle=colors[g.variant%colors.length];
        ctx.beginPath();ctx.arc(0,-r*.35,r,Math.PI,0);ctx.closePath();ctx.fill();
        // canopy panel lines + suspension cords
        ctx.strokeStyle='#43505a';ctx.lineWidth=1.1;
        for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(k*r*.42,-r*.35);ctx.lineTo(0,r*.60);ctx.stroke();}
        // parachutist
        ctx.fillStyle='#263744';ctx.beginPath();ctx.arc(0,r*.66,r*.14,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#263744';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,r*.80);ctx.lineTo(0,r*1.25);ctx.moveTo(0,r*.92);ctx.lineTo(-r*.25,r*1.05);ctx.moveTo(0,r*.92);ctx.lineTo(r*.25,r*1.05);ctx.moveTo(0,r*1.25);ctx.lineTo(-r*.18,r*1.50);ctx.moveTo(0,r*1.25);ctx.lineTo(r*.18,r*1.50);ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawBoats(){
    for(const b of boats){
      ctx.save();ctx.translate(b.x,b.y);ctx.scale(b.scale,b.scale);
      if(b.type==='sail'){
        ctx.fillStyle='#f7f5ea';ctx.beginPath();ctx.moveTo(-25,3);ctx.lineTo(24,3);ctx.lineTo(16,11);ctx.lineTo(-18,11);ctx.closePath();ctx.fill();
        ctx.strokeStyle='#79563e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo(0,-38);ctx.stroke();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(2,-35);ctx.lineTo(2,0);ctx.lineTo(25,0);ctx.closePath();ctx.fill();
        ctx.fillStyle='#d75a48';ctx.beginPath();ctx.moveTo(-2,-30);ctx.lineTo(-2,0);ctx.lineTo(-19,0);ctx.closePath();ctx.fill();
      }else{
        ctx.fillStyle='#f2f0e8';ctx.fillRect(-35,-9,65,15);ctx.fillStyle='#354f5b';ctx.fillRect(-28,-17,45,9);
        ctx.fillStyle='#d55247';ctx.beginPath();ctx.moveTo(-39,6);ctx.lineTo(35,6);ctx.lineTo(26,14);ctx.lineTo(-30,14);ctx.closePath();ctx.fill();
        ctx.fillStyle='#8fd0df';for(let k=0;k<4;k++)ctx.fillRect(-23+k*11,-14,7,4);
      }
      // wake
      ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-42,15);ctx.quadraticCurveTo(-65,10,-84,17);ctx.stroke();
      ctx.restore();
    }
  }

  function draw() {
    ctx.save();
    if (screenShake) ctx.translate((Math.random()-.5)*W*screenShake,(Math.random()-.5)*H*screenShake);
    drawBackground();
    drawBoats();
    obstacles.forEach(drawObstacle);
    drawSkyGuests();
    for(const h of hearts){
      ctx.save();ctx.translate(h.x,h.y+Math.sin(h.phase)*4);ctx.fillStyle='#ff6fa6';
      ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-16,0,-13,-13,-4,-13);ctx.bezierCurveTo(0,-13,2,-9,0,-6);ctx.bezierCurveTo(2,-9,4,-13,8,-13);ctx.bezierCurveTo(16,-13,18,0,0,10);ctx.fill();ctx.restore();
    }
for(const h of hearts){ctx.save();ctx.translate(h.x,h.y+Math.sin(h.phase)*4);ctx.fillStyle='#ff6fa6';ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-16,0,-13,-13,-4,-13);ctx.bezierCurveTo(0,-13,2,-9,0,-6);ctx.bezierCurveTo(2,-9,4,-13,8,-13);ctx.bezierCurveTo(16,-13,18,0,0,10);ctx.fill();ctx.restore();}
    drawPlane();
    for (const p of wind) {ctx.globalAlpha=Math.max(0,p.life/.6);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x-p.len*.45,p.y,p.x-p.len,p.y+2);ctx.stroke();}
    for (const p of particles) {ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ff9fc8';ctx.fillRect(p.x,p.y,p.size,p.size);}
    ctx.globalAlpha=1;
    for(const p of heartBursts){
      ctx.save();
      ctx.globalAlpha=Math.max(0,p.life/.58);
      ctx.translate(p.x,p.y);
      const z=p.size;
      ctx.fillStyle='#ff6fa6';
      ctx.beginPath();
      ctx.moveTo(0,z);
      ctx.bezierCurveTo(-z*1.4,0,-z,-z,z*0,-z*.35);
      ctx.bezierCurveTo(z,-z,z*1.4,0,0,z);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
    drawBat();
    ctx.restore();
    if (impactFlash > 0) {
      ctx.fillStyle = (Math.floor(crashTime*18)%2===0) ? 'rgba(255,110,150,.35)' : 'rgba(255,255,255,.16)';
      ctx.fillRect(0,0,W,H);
      impactFlash = Math.max(0,impactFlash-0.016);
    }
  }

  function loop(now) {
    const dt = Math.min(0.033, Math.max(0.001, (now-lastTime)/1000));
    lastTime = now;
    if (state === 'play') update(dt);
    else if (state === 'crash') updateCrash(dt);
    draw();
    raf = requestAnimationFrame(loop);
  }

  function pointerDown(e) {
    e.preventDefault();
    if (state === 'menu' || state === 'over') resetGame();
    if (state === 'play') holding = true;
  }
  function pointerUp() { holding = false; }
  addEventListener('pointerdown',pointerDown,{passive:false});
  addEventListener('pointerup',pointerUp);
  addEventListener('pointercancel',pointerUp);
  addEventListener('blur',pointerUp);
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='menu'||state==='over')resetGame();holding=true;}});
  addEventListener('keyup',e=>{if(e.code==='Space')holding=false;});
  document.getElementById('again').onclick = resetGame;
  document.getElementById('share').onclick = async () => {
    const score = finalEl.textContent;
    const city = currentCity().name;
    const msg = `I flew ${score}m and burst ${heartCount} hearts in Vicky the Bat! 🦇🌍 Last city: ${currentCity().name}. Can you beat me?`;
    try {
      if (navigator.share) await navigator.share({title:'Vicky the Bat',text:msg});
      else if (navigator.clipboard) {await navigator.clipboard.writeText(msg); alert('Score copied!');}
      else alert(msg);
    } catch (_) {}
  };

  pillEl.textContent = 'BEST ' + best + ' m';
  scoreEl.innerHTML = '0<small> m</small>'; document.getElementById('heartScore').textContent='♥ 0'; document.getElementById('heartProgress').textContent='0/300';
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
