<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vicky the Bat</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182238}body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%}#hud{position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;color:#fff}#meters{font-size:50px;font-weight:1000;line-height:.85;letter-spacing:-2px;text-shadow:0 4px 7px #0006}#meters small{font-size:18px;letter-spacing:0}#city{font-size:10px;letter-spacing:2px;font-weight:900;margin-top:6px;text-shadow:0 2px 4px #0007}#best{background:#182238a8;padding:9px 12px;border-radius:999px;font-size:10px;font-weight:1000;height:max-content}#intro,#gameover{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;color:#fff;background:linear-gradient(#15223b00,#15223bb8)}#intro .title{font-size:clamp(52px,15vw,92px);font-weight:1000;letter-spacing:-5px;line-height:.82;text-shadow:0 8px 18px #0006}#intro .title .pink{color:#ff79ac}#intro .vicky{font-size:80px;margin-bottom:18px}#gameover{display:none}#gameover .score{font-size:76px;font-weight:1000;color:#ff9fc7}#gameover button{border:0;border-radius:999px;padding:14px 38px;background:#ff6ea6;color:#fff;font-size:18px;font-weight:1000;box-shadow:0 7px #b43c70}</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div><div id="meters">0<small> m</small></div><div id="city">PARIS</div></div><div id="best">BEST 0 m</div></div>
<div id="intro"><div><div class="vicky">🦇</div><div class="title">VICKY <span class="pink">THE BAT</span></div></div></div>
<div id="gameover"><div><div style="font-size:11px;letter-spacing:2px;font-weight:1000">YOU FLEW</div><div id="final" class="score">0</div><div>metres</div><p id="newbest"></p><button id="again">FLY AGAIN</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const intro=document.getElementById('intro'),gameover=document.getElementById('gameover'),meters=document.getElementById('meters'),cityLabel=document.getElementById('city'),bestEl=document.getElementById('best'),finalEl=document.getElementById('final'),newBestEl=document.getElementById('newbest'),again=document.getElementById('again');
let W=innerWidth,H=innerHeight,dpr=1,last=0,t=0,state='menu',hold=false,distance=0,best=+(localStorage.vickyBatBest||0),scroll=0,spawn=1.1;let obstacles=[],wind=[],sparks=[],crashT=0,crashVy=0,crashSpin=0,shake=0;let plane={x:-280,y:80,flag:0};const bat={x:.28,y:0,vy:0,r:22,wing:0};
const cities=[{name:'PARIS',flag:'france',landmarks:['eiffel','arc'],weather:'sun',bg:['#bcdcff','#fff4ef']},{name:'EGYPT',flag:'egypt',landmarks:['pyramid','sphinx','obelisk'],weather:'sun',bg:['#f4c66d','#ffeac0']},{name:'NEW YORK',flag:'usa',landmarks:['skyscraper','statue','bridge'],weather:'rain',bg:['#263758','#0e1728']},{name:'SYDNEY',flag:'australia',landmarks:['opera','bridge','beach'],weather:'sun',bg:['#79cff1','#e7fbff']},{name:'LONDON',flag:'uk',landmarks:['bigben','bridge','phone'],weather:'rain',bg:['#839cb7','#3d4a59']},{name:'ROME',flag:'italy',landmarks:['colosseum','columns','piazza'],weather:'sun',bg:['#efad73','#ffe2bf']}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);bat.r=Math.max(17,Math.min(24,Math.min(W,H)*.045));if(state==='menu')bat.y=H*.5}addEventListener('resize',resize);resize();
function cityIndex(){return Math.floor(distance/380)%cities.length}function currentCity(){return cities[cityIndex()]}function difficulty(){return Math.min(1,distance/2400)}function speed(){return t<=20?78:Math.min(440,78+(t-20)*3.6+distance*.14)}
function start(){state='play';intro.style.display='none';gameover.style.display='none';t=0;distance=0;scroll=0;spawn=.8;obstacles=[];wind=[];sparks=[];crashT=0;crashVy=0;crashSpin=0;shake=0;plane.x=-280;plane.flag=0;bat.y=H*.5;bat.vy=0;meters.innerHTML='0<small> m</small>'}
function crash(){if(state!=='play')return;state='crash';hold=false;crashT=0;crashVy=-190;crashSpin=0;shake=.5;for(let i=0;i<38;i++)sparks.push({x:bat.x*W,y:bat.y,vx:-210+Math.random()*420,vy:-260+Math.random()*300,life:.7+Math.random()*.7,size:2+Math.random()*5})}
function finish(){const score=Math.floor(distance),isBest=score>best;if(isBest){best=score;localStorage.vickyBatBest=best}finalEl.textContent=score;bestEl.textContent='BEST '+best+' m';newBestEl.textContent=isBest?'NEW BEST!':'';state='over';gameover.style.display='grid'}
function flap(){bat.vy=Math.max(-270,bat.vy-108);bat.wing=.2;for(let i=0;i<3;i++)wind.push({x:bat.x*W-18,y:bat.y+Math.random()*10,vx:-50-Math.random()*40,vy:(Math.random()-.5)*18,life:.6,len:20+Math.random()*28})}
function spawnObstacle(){const city=currentCity(),d=difficulty(),gap=Math.max(155,Math.min(H*.48,300-d*105)),gy=H*.14+Math.random()*Math.max(12,H*.70-gap),w=Math.max(52,Math.min(108,W*(.12+.055*d))),type=city.landmarks[Math.floor(Math.random()*city.landmarks.length)];obstacles.push({x:W+40,y:0,w,h:gy,type},{x:W+40,y:gy+gap,w,h:H-gy-gap,type})}
function hit(o){const px=bat.x*W,py=bat.y,rx=Math.max(o.x,Math.min(px,o.x+o.w)),ry=Math.max(o.y,Math.min(py,o.y+o.h));return(px-rx)**2+(py-ry)**2<(bat.r*.78)**2}
function drawFlag(name,x,y,w,h){ctx.save();ctx.translate(x,y);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);if(name==='france'){ctx.fillStyle='#1e5aa8';ctx.fillRect(0,0,w/3,h);ctx.fillStyle='#ef3340';ctx.fillRect(w*2/3,0,w/3,h)}else if(name==='italy'){ctx.fillStyle='#169b62';ctx.fillRect(0,0,w/3,h);ctx.fillStyle='#ce2b37';ctx.fillRect(w*2/3,0,w/3,h)}else if(name==='egypt'){ctx.fillStyle='#ce1126';ctx.fillRect(0,0,w,h/3);ctx.fillStyle='#000';ctx.fillRect(0,h*2/3,w,h/3);ctx.fillStyle='#d9a300';ctx.fillRect(w*.46,h*.36,w*.08,h*.28)}else if(name==='usa'){ctx.fillStyle='#b22234';ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff';for(let i=1;i<7;i++)ctx.fillRect(0,i*h/7,w,h/14);ctx.fillStyle='#3c3b6e';ctx.fillRect(0,0,w*.42,h*.55)}else if(name==='uk'){ctx.fillStyle='#012169';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#fff';ctx.lineWidth=h*.22;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w,h);ctx.moveTo(w,0);ctx.lineTo(0,h);ctx.stroke();ctx.strokeStyle='#c8102e';ctx.lineWidth=h*.11;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w,h);ctx.moveTo(w,0);ctx.lineTo(0,h);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(w*.43,0,w*.14,h);ctx.fillRect(0,h*.40,w,h*.20);ctx.fillStyle='#c8102e';ctx.fillRect(w*.46,0,w*.08,h);ctx.fillRect(0,h*.44,w,h*.12)}else if(name==='australia'){ctx.fillStyle='#012169';ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(w*.74,h*.62,h*.18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(w*(.28+i*.14),h*(.55+(i%2)*.12),2,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#fff';ctx.lineWidth=h*.20;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w*.44,h*.55);ctx.moveTo(w*.44,0);ctx.lineTo(0,h*.55);ctx.stroke()}ctx.strokeStyle='rgba(20,30,40,.3)';ctx.lineWidth=1;ctx.strokeRect(0,0,w,h);ctx.restore()}
function drawPlane(){ctx.save();ctx.translate(plane.x,plane.y);ctx.strokeStyle='rgba(40,50,60,.65)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-25,2);ctx.lineTo(-72,4);ctx.stroke();drawFlag(currentCity().flag,-190,-11,116,24);ctx.fillStyle='#f9fbff';ctx.strokeStyle='#4d5c6a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,30,9,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#ff79ac';ctx.beginPath();ctx.moveTo(5,-2);ctx.lineTo(-6,-21);ctx.lineTo(18,-5);ctx.closePath();ctx.fill();ctx.fillStyle='#dce7f0';ctx.beginPath();ctx.moveTo(-7,2);ctx.lineTo(-20,18);ctx.lineTo(11,5);ctx.closePath();ctx.fill();ctx.restore()}
function renderCity(){const city=currentCity(),grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,city.bg[0]);grad.addColorStop(1,city.bg[1]);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);if(city.name==='PARIS'){ctx.fillStyle='#596b77';ctx.fillRect(0,H*.82,W,H*.18);const cx=W*.56,base=H*.82;ctx.fillStyle='#6b5549';ctx.beginPath();ctx.moveTo(cx,base-H*.52);ctx.lineTo(cx-W*.07,base);ctx.lineTo(cx+W*.07,base);ctx.closePath();ctx.fill();ctx.fillStyle='#4d5d68';ctx.fillRect(cx-W*.012,base-H*.42,W*.024,H*.42);ctx.fillStyle='#b38a66';ctx.fillRect(W*.13,H*.58,W*.34,H*.07);ctx.fillStyle='#7c5b49';for(let i=0;i<5;i++)ctx.fillRect(W*(.12+i*.07),H*.51,5,H*.31)}else if(city.name==='EGYPT'){ctx.fillStyle='#df9c4d';ctx.fillRect(0,H*.82,W,H*.18);ctx.fillStyle='#d3a45e';[[.24,.46,.24],[.52,.55,.32],[.78,.40,.26]].forEach(([cx,h,w])=>{ctx.beginPath();ctx.moveTo(W*cx,H*.82-H*h);ctx.lineTo(W*(cx-w/2),H*.82);ctx.lineTo(W*(cx+w/2),H*.82);ctx.closePath();ctx.fill()});ctx.fillStyle='#b58a58';ctx.beginPath();ctx.arc(W*.08,H*.72,34,0,Math.PI*2);ctx.fill()}else if(city.name==='NEW YORK'){ctx.fillStyle='#18283e';ctx.fillRect(0,H*.82,W,H*.18);const bs=[.02,.14,.26,.41,.53,.68,.84];bs.forEach((px,i)=>{let bw=W*(i%2?.08:.10),bh=H*(.18+((i*17)%25)/100),top=H*.82-bh;ctx.fillStyle=['#263b55','#394f68','#203148'][i%3];ctx.fillRect(W*px,top,bw,bh);ctx.fillStyle='#ffd76a';for(let y=top+12;y<top+bh-8;y+=24)for(let x=W*px+8;x<W*px+bw-6;x+=18)ctx.fillRect(x,y,7,9)}ctx.fillStyle='#4e8e82';ctx.beginPath();ctx.arc(W*.58,H*.57,14,0,Math.PI*2);ctx.fill();ctx.fillRect(W*.565,H*.57,9,H*.18)}else if(city.name==='SYDNEY'){ctx.fillStyle='#54c1df';ctx.fillRect(0,H*.74,W,H*.26);ctx.fillStyle='#f6fafc';for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(W*.29+i*16,H*.63);ctx.quadraticCurveTo(W*.31+i*16,H*.47,W*.34+i*16,H*.63);ctx.lineTo(W*.34+i*16,H*.65);ctx.lineTo(W*.29+i*16,H*.65);ctx.closePath();ctx.fill()}ctx.strokeStyle='#486271';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.06,H*.65);ctx.quadraticCurveTo(W*.52,H*.40,W*.94,H*.65);ctx.stroke()}else if(city.name==='LONDON'){ctx.fillStyle='#394b5b';ctx.fillRect(0,H*.82,W,H*.18);const bx=W*.52,top=H*.30;ctx.fillStyle='#4f6574';ctx.fillRect(bx,top,W*.07,H*.52);ctx.fillStyle='#e8ddc7';ctx.beginPath();ctx.arc(bx+W*.035,top+H*.12,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6e594c';ctx.fillRect(bx-W*.015,top-W*.03,W*.10,H*.05);ctx.fillStyle='#b84b3f';ctx.fillRect(W*.14,H*.63,W*.05,H*.14)}else{ctx.fillStyle='#d58e51';ctx.fillRect(0,H*.81,W,H*.19);ctx.fillStyle='#a66b4c';ctx.beginPath();ctx.arc(W*.55,H*.58,82,Math.PI,0);ctx.fill();ctx.fillRect(W*.47,H*.58,W*.16,H*.23);for(let i=0;i<6;i++){ctx.fillStyle='#c7a067';ctx.fillRect(W*(.10+i*.12),H*.60,W*.035,H*.20)}}if(city.weather==='rain'){ctx.strokeStyle='rgba(170,205,230,.35)';ctx.lineWidth=2;for(let i=0;i<85;i++){const x=(i*79+scroll*1.2)%W,y=(i*47+t*400)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+17);ctx.stroke()}}}
function drawObstacle(o){const x=o.x,y=o.y,w=o.w,h=o.h;ctx.save();if(o.type==='eiffel'){ctx.fillStyle='#5a6570';ctx.beginPath();ctx.moveTo(x+w*.5,y+4);ctx.lineTo(x+w*.16,y+h);ctx.lineTo(x+w*.30,y+h);ctx.lineTo(x+w*.5,y+h*.35);ctx.lineTo(x+w*.70,y+h);ctx.lineTo(x+w*.84,y+h);ctx.closePath();ctx.fill()}else if(o.type==='arc'){ctx.fillStyle='#b79b7c';ctx.fillRect(x,y,w,h);ctx.fillStyle='#775f4f';ctx.beginPath();ctx.arc(x+w*.5,y+h*.43,w*.22,Math.PI,0);ctx.fill();ctx.fillRect(x+w*.39,y+h*.43,w*.22,h*.30)}else if(o.type==='pyramid'){ctx.fillStyle='#d2a35f';ctx.beginPath();ctx.moveTo(x+w*.5,y);ctx.lineTo(x+w*.05,y+h);ctx.lineTo(x+w*.95,y+h);ctx.closePath();ctx.fill()}else if(o.type==='sphinx'){ctx.fillStyle='#ad8551';ctx.beginPath();ctx.ellipse(x+w*.48,y+h*.68,w*.38,h*.20,0,0,Math.PI*2);ctx.fill();ctx.fillRect(x+w*.12,y+h*.54,w*.72,h*.25)}else if(o.type==='obelisk'){ctx.fillStyle='#9e7950';ctx.fillRect(x+w*.36,y,w*.28,h)}else if(o.type==='skyscraper'){ctx.fillStyle='#263b55';ctx.fillRect(x,y,w,h);ctx.fillStyle='#ffd66b';for(let yy=y+10;yy<y+h-8;yy+=24)for(let xx=x+8;xx<x+w-6;xx+=17)ctx.fillRect(xx,yy,7,9)}else if(o.type==='statue'){ctx.fillStyle='#4f9288';ctx.fillRect(x+w*.43,y,w*.14,h);ctx.beginPath();ctx.arc(x+w*.5,y+18,11,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x+w*.15,y+52);ctx.lineTo(x+w*.5,y+10);ctx.lineTo(x+w*.85,y+52);ctx.closePath();ctx.fill()}else if(o.type==='bridge'){ctx.strokeStyle='#566f81';ctx.lineWidth=6;ctx.beginPath();ctx.arc(x+w*.5,y+h*.72,w*.42,Math.PI,0);ctx.stroke()}else if(o.type==='opera'){ctx.fillStyle='#f4f8fb';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x+w*(.12+i*.18),y+h*.65);ctx.quadraticCurveTo(x+w*(.16+i*.18),y+4,x+w*(.30+i*.18),y+h*.65);ctx.lineTo(x+w*(.30+i*.18),y+h*.73);ctx.lineTo(x+w*(.10+i*.18),y+h*.73);ctx.closePath();ctx.fill()}}else if(o.type==='bigben'){ctx.fillStyle='#4f6676';ctx.fillRect(x+w*.25,y,w*.5,h);ctx.fillStyle='#ede3cb';ctx.beginPath();ctx.arc(x+w*.5,y+h*.22,10,0,Math.PI*2);ctx.fill()}else if(o.type==='phone'){ctx.fillStyle='#bb413a';ctx.fillRect(x+w*.18,y,w*.64,h);ctx.fillStyle='#f1d8ad';ctx.fillRect(x+w*.30,y+h*.18,w*.40,h*.20)}else if(o.type==='colosseum'){ctx.fillStyle='#af7d56';ctx.fillRect(x,y+h*.28,w,h*.72);ctx.fillStyle='#e8d5b8';for(let yy=y+h*.38;yy<y+h*.86;yy+=22)for(let xx=x+10;xx<x+w-10;xx+=24){ctx.beginPath();ctx.arc(xx+7,yy,7,Math.PI,0);ctx.fill();ctx.fillRect(xx,yy,14,9)}}else if(o.type==='columns'){ctx.fillStyle='#c4a574';for(let i=0;i<4;i++)ctx.fillRect(x+w*(.12+i*.24),y,w*.10,h)}else{ctx.fillStyle='#c7a27c';ctx.fillRect(x+w*.12,y+h*.42,w*.76,h*.58)}ctx.restore()}
function drawBat(){const x=bat.x*W,y=bat.y,f=.5+Math.sin(t*14)*.5;ctx.save();ctx.translate(x,y);if(state==='crash')ctx.rotate(crashSpin);ctx.fillStyle='#1b2530';ctx.beginPath();ctx.ellipse(0,4,18,24,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0c1218';ctx.beginPath();ctx.arc(0,-10,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f2f4f5';ctx.beginPath();ctx.moveTo(-12,-9);ctx.lineTo(-5,-26);ctx.lineTo(2,-19);ctx.lineTo(9,-26);ctx.lineTo(14,-8);ctx.lineTo(6,-2);ctx.lineTo(-1,-9);ctx.lineTo(-8,-2);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-11,4,0,Math.PI*2);ctx.arc(6,-10,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#20242a';ctx.beginPath();ctx.arc(-5,-10,2,0,Math.PI*2);ctx.arc(7,-9,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffb3cf';ctx.beginPath();ctx.arc(-5,-11,2,0,Math.PI*2);ctx.arc(6,-10,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8eb9';ctx.beginPath();ctx.moveTo(14,-3);ctx.lineTo(27,2);ctx.lineTo(14,6);ctx.closePath();ctx.fill();ctx.fillStyle='#171f29';ctx.beginPath();ctx.moveTo(-10,4);ctx.quadraticCurveTo(-34,-20-9*f,-48,-8);ctx.quadraticCurveTo(-34,10,-10,13);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(10,4);ctx.quadraticCurveTo(34,-20-9*f,48,-8);ctx.quadraticCurveTo(34,10,10,13);ctx.closePath();ctx.fill();ctx.strokeStyle='#ff8eb9';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-12,7);ctx.lineTo(-39,-5);ctx.moveTo(12,7);ctx.lineTo(39,-5);ctx.stroke();ctx.restore()}
function update(dt){t+=dt;const sp=speed();scroll+=sp*dt;distance+=sp*dt*.055;cityLabel.textContent=currentCity().name;if(hold)flap();bat.vy+=790*dt;bat.vy*=.994;bat.y+=bat.vy*dt;if(bat.y<bat.r||bat.y>H-bat.r)return crash();spawn-=dt;if(spawn<=0){spawnObstacle();spawn=Math.max(.82,1.65-difficulty()*.45+Math.random()*.22)}for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.x-=sp*dt;if(o.x+o.w<-100)obstacles.splice(i,1);else if(hit(o))return crash()}plane.x+=(30+sp*.10)*dt;if(plane.x>W+320){plane.x=-300;plane.flag=(plane.flag+1)%cities.length}if(Math.random()<dt*9)wind.push({x:bat.x*W-18,y:bat.y+Math.random()*14,vx:-30,vy:(Math.random()-.5)*14,life:.55,len:18+Math.random()*24});for(let i=wind.length-1;i>=0;i--){const p=wind[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)wind.splice(i,1)}meters.innerHTML=Math.floor(distance)+'<small> m</small>'}
function updateCrash(dt){crashT+=dt;crashVy+=1150*dt;bat.y+=crashVy*dt;crashSpin+=dt*8;shake*=.92;for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;if(p.life<=0)sparks.splice(i,1)}if(crashT>1.3||bat.y>H+90)finish()}
function draw(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*W*shake,(Math.random()-.5)*H*shake);renderCity();obstacles.forEach(drawObstacle);drawPlane();ctx.globalAlpha=1;for(const p of wind){ctx.globalAlpha=Math.max(0,p.life);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.len,p.y+2);ctx.stroke()}for(const p of sparks){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.life>.35?'#ffd56b':'#ff6fa9';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;drawBat();ctx.restore();if(state==='crash'&&crashT<.7){ctx.fillStyle=(Math.floor(crashT*18)%2===0)?'rgba(255,100,140,.35)':'rgba(255,255,255,.18)';ctx.fillRect(0,0,W,H)}}
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;if(state==='play')update(dt);else if(state==='crash')updateCrash(dt);else t+=dt;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function down(e){e.preventDefault();if(state==='menu'||state==='over')start();if(state==='play')hold=true}function up(){hold=false}addEventListener('pointerdown',down,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up);addEventListener('blur',up);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='menu'||state==='over')start();hold=true}});addEventListener('keyup',e=>{if(e.code==='Space')hold=false});again.onclick=start;bestEl.textContent='BEST '+best+' m';
})();
</script></body></html>
