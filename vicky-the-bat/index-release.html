  function resetGame(){state='play';intro.classList.add('hidden');gameover.classList.add('hidden');t=0;distance=0;cityIndex=0;cityTime=0;spawnTime=.8;weatherTime=0;weather='sun';worldScroll=0;screenShake=0;crashTime=0;crashVelocity=0;crashRotation=0;impactFlash=0;plane={x:-230,y:70,flag:currentCity().flag,flagIndex:0,flagClock:0};obstacles=[];wind=[];particles=[];hearts=[];heartBursts=[];heartCount=0;heartPathPhase=0;bat.y=H*.5;bat.vy=0;bat.wingPulse=0;bat.wingPhase=0;scoreEl.innerHTML='0<small> m</small>';cityEl.textContent=currentCity().name}
  function beginCrash(){if(state!=='play')return;state='crash';holding=false;crashTime=0;crashVelocity=-190;crashRotation=0;screenShake=.45;for(let i=0;i<40;i++)particles.push({x:bat.x*W,y:bat.y,vx:-220+Math.random()*440,vy:-270+Math.random()*320,life:.75+Math.random()*.55,size:2+Math.random()*5})}
  function finishRun(){const score=Math.floor(distance);const isNewBest=score>best;if(isNewBest){best=score;localStorage.setItem('vickyBatBestFixed',String(best));}finalEl.textContent=String(score);lastCityEl.textContent='LAST CITY: '+currentCity().name;newBestEl.textContent=isNewBest?'NEW BEST!':'';pillEl.textContent='BEST '+best+' m';state='over';gameover.classList.remove('hidden')}
  function flap(){bat.vy=Math.max(-280,bat.vy-106);bat.flapPhase=.18;bat.wingPulse=1;bat.wingPhase+=Math.PI*.85;for(let i=0;i<3;i++)wind.push({x:bat.x*W-18,y:bat.y+Math.random()*12,vx:-50-Math.random()*30,vy:(Math.random()-.5)*18,life:.55,len:18+Math.random()*28})}
  function chooseWeather(dt){weatherTime-=dt;if(weatherTime<=0){const list=currentCity().weather;weather=list[Math.floor(Math.random()*list.length)];weatherTime=5+Math.random()*4}}
  function spawnObstacle(){const d=difficulty();const gap=Math.max(155,Math.min(H*.48,300-d*120));const gy=H*.14+Math.random()*Math.max(10,H*.70-gap);const w=Math.max(52,Math.min(110,W*(.12+.055*d)));const pool=['eiffel','statue','bigben','burj','sleigh','giraffe','volcano','skyscraper','bridge','charles','hallgrim','indiaGate','goldengate','parliament'];const type=pool[Math.floor(Math.random()*pool.length)];obstacles.push({x:W+50,y:0,w,h:gy,type},{x:W+50,y:gy+gap,w,h:H-gy-gap,type})}
  function hit(o){const px=bat.x*W,py=bat.y;const narrow=['phone','hydrant','giraffe','tree','palm','obelisk','bigben','eiffel','statue','burj'].includes(o.type||'');const insetX=narrow?Math.min(o.w*.32,20):Math.min(o.w*.16,12);const insetY=Math.min(o.h*.08,10);const left=o.x+insetX,right=o.x+o.w-insetX,top=o.y+insetY,bottom=o.y+o.h-insetY;if(right<=left||bottom<=top)return false;const rx=Math.max(left,Math.min(px,right)),ry=Math.max(top,Math.min(py,bottom));const hitRadius=bat.r*(narrow?.54:.62);return(px-rx)*(px-rx)+(py-ry)*(py-ry)<hitRadius*hitRadius}
  function update(dt){t+=dt;const sp=speed();worldScroll+=sp*dt;distance+=sp*dt*.055;if(holding)flap();bat.vy+=790*dt;bat.vy*=.994;bat.y+=bat.vy*dt;bat.flapPhase=Math.max(0,bat.flapPhase-dt);bat.wingPulse=Math.max(0,bat.wingPulse-dt*3.8);bat.wingPhase+=dt*(8+Math.min(7,Math.abs(bat.vy)*.018));if(bat.y<bat.r||bat.y>H-bat.r)return beginCrash();cityIndex=cityIndexForDistance();cityEl.textContent=currentCity().name;chooseWeather(dt);spawnTime-=dt;if(spawnTime<=0){spawnObstacle();spawnTime=Math.max(.9,1.65-difficulty()*.55+Math.random()*.25)}heartPathPhase+=dt*1.8;if(Math.random()<dt*.42&&hearts.length<5){const lane=hearts.length%3;const zigY=H*(.38+lane*.10)+Math.sin(heartPathPhase*1.15+lane)*H*.035;hearts.push({x:W+70+lane*24,y:zigY,phase:Math.random()*6.28,r:13,lane})}for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.x-=sp*dt;const ref=o.type&&o.type.passThroughPadding?o.type:null;if(o.x+o.w<-80){obstacles.splice(i,1);continue}if(hit(o))return beginCrash()}for(let i=hearts.length-1;i>=0;i--){const h=hearts[i];h.x-=sp*dt;if(h.x<-60){hearts.splice(i,1);continue}const dx=bat.x*W-h.x,dy=bat.y-h.y,rr=bat.r*.70+h.r*1.15;if(dx*dx+dy*dy<rr*rr){hearts.splice(i,1);heartCount++;for(let j=0;j<16;j++){const a=(Math.PI*2*j)/16+Math.random()*.18,v=70+Math.random()*90;heartBursts.push({x:h.x,y:h.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.58,size:3+Math.random()*3})}}}for(let i=wind.length-1;i>=0;i--){const p=wind[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)wind.splice(i,1)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;if(p.life<=0)particles.splice(i,1)}for(let i=heartBursts.length-1;i>=0;i--){const p=heartBursts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;if(p.life<=0)heartBursts.splice(i,1)}scoreEl.innerHTML=Math.floor(distance)+'<small> m</small>';document.getElementById('heartScore').textContent='♥ '+heartCount;document.getElementById('heartProgress').textContent=heartCount+'/300'}
  function updateCrash(dt){crashTime+=dt;crashVelocity+=650*dt;bat.y+=crashVelocity*dt;crashRotation+=dt*7;screenShake=Math.max(0,screenShake-dt*.9);if(crashTime>.7)finishRun()}
  function gradient(a,b){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,a);grad.addColorStop(1,b);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H)}
  function drawBackground(){const c=currentCity().name;if(c==='NEW YORK')drawNewYork();else if(c==='PRAGUE')drawPrague();else if(c==='PARIS')drawParis();else if(c==='DUBAI')drawDubai();else if(c==='SYDNEY')drawSydney();else if(c==='LONDON')drawLondon();else if(c==='AMSTERDAM')drawAmsterdam();else if(c==='REYKJAVIK')drawReykjavik();else if(c==='AGRA')drawAgra();else if(c==='RIO DE JANEIRO')drawRio();else if(c==='SAN FRANCISCO')drawSanFrancisco();else if(c==='MEXICO CITY')drawMexicoCity();else if(c==='NORTH POLE')drawNorthPole();else if(c==='ANTARCTICA')drawAntarctica();else if(c==='BUDAPEST')drawBudapest();else drawGenericCity(currentCity());if(weather==='rain')drawRain();if(weather==='snow')drawSnow();drawClouds();drawBalloon()}
  function drawGenericCity(c){gradient(c.palette[0],c.palette[1]);const ground=H*.81;ctx.fillStyle=(c.name==='MARRAKESH'||c.name==='CAIRO'||c.name==='MUSCAT'||c.name==='DOHA')?'#b57f55':'rgba(66,82,94,.46)';ctx.fillRect(0,ground,W,H-ground);for(let i=0;i<9;i++){const x=i*125-(worldScroll*.05%125),bh=H*(.10+((i*17)%21)/100);ctx.fillStyle=(i%2)?'rgba(73,91,102,.55)':'rgba(91,105,116,.46)';ctx.fillRect(x,ground-bh,92,bh)}(c.landmarks||[]).slice(0,2).forEach((type,j)=>{const x=W*(.28+j*.44),base=ground,w=Math.min(W*.24,165),h=H*.38;ctx.save();if(['eiffel','tower','skytree','monas','spire','obelisk','angel'].includes(type)){ctx.fillStyle=type==='eiffel'?'#7b6757':'#6d7f89';ctx.fillRect(x-w*.05,base-h,w*.10,h);ctx.beginPath();ctx.moveTo(x,base-h-H*.06);ctx.lineTo(x-w*.08,base-h);ctx.lineTo(x+w*.08,base-h);ctx.closePath();ctx.fill()}else if(['bridge','goldengate','harborbridge','chain','erasmus','stonebridge'].includes(type)){ctx.strokeStyle=type==='goldengate'?'#d5543f':'#586d77';ctx.lineWidth=type==='goldengate'?8:7;ctx.beginPath();ctx.arc(x,base,w*.55,Math.PI,0);ctx.stroke();ctx.strokeStyle=type==='goldengate'?'#e06e57':'#7d8e96';ctx.lineWidth=2;for(let k=0;k<10;k++){const px=x-w*.45+k*w*.10;ctx.beginPath();ctx.moveTo(px,base);ctx.lineTo(x,base-w*.38);ctx.stroke()}}else if(['opera'].includes(type)){ctx.fillStyle='#f9fcfc';for(let k=0;k<5;k++){ctx.beginPath();ctx.moveTo(x-w*.25+k*w*.10,base-h*.36);ctx.quadraticCurveTo(x-w*.20+k*w*.10,base-h*.82,x-w*.08+k*w*.10,base-h*.36);ctx.closePath();ctx.fill()}}else if(['windmill'].includes(type)){ctx.fillStyle='#7a654e';ctx.fillRect(x-w*.08,base-h*.52,w*.16,h*.52);ctx.strokeStyle='#594b42';ctx.lineWidth=5;for(let k=0;k<4;k++){const a=k*Math.PI/2+.2;ctx.beginPath();ctx.moveTo(x,base-h*.46);ctx.lineTo(x+Math.cos(a)*w*.53,base-h*.46+Math.sin(a)*h*.35);ctx.stroke()}}else if(['pyramid','sphinx','volcano','sugarloaf','hill','cliff','mountain','alps','andes','remarkables','fjord'].includes(type)){ctx.fillStyle=(type==='pyramid'||type==='sphinx')?'#c08d55':'#718da0';ctx.beginPath();ctx.moveTo(x,base-h);ctx.lineTo(x-w*.50,base);ctx.lineTo(x+w*.50,base);ctx.closePath();ctx.fill();if(type!=='pyramid'&&type!=='sphinx'){ctx.fillStyle='#f8fbfd';ctx.beginPath();ctx.moveTo(x,base-h);ctx.lineTo(x-w*.13,base-h*.55);ctx.lineTo(x,base-h*.62);ctx.lineTo(x+w*.13,base-h*.55);ctx.closePath();ctx.fill()}}else if(['mosque','palace','cathedral','basilica','church','parliament','castle','museum','forbidden'].includes(type)){ctx.fillStyle='#d2b18c';ctx.fillRect(x-w*.34,base-h*.60,w*.68,h*.60);ctx.fillStyle='#8a705c';ctx.beginPath();ctx.arc(x,base-h*.60,w*.22,Math.PI,0);ctx.fill();ctx.fillRect(x-w*.04,base-h*.90,w*.08,h*.30)}else if(['beach','harbor','waterfront','lake','canal','bay'].includes(type)){ctx.fillStyle='#4faec1';ctx.fillRect(x-w*.50,base-h*.18,w,h*.18);ctx.fillStyle='#8b6b59';ctx.fillRect(x-w*.40,base-h*.44,w*.22,h*.28);ctx.fillStyle='#6eaa6a';ctx.beginPath();ctx.arc(x+w*.28,base-h*.15,w*.20,Math.PI,0);ctx.fill()}else{ctx.fillStyle='#bd9a75';ctx.fillRect(x-w*.35,base-h*.55,w*.70,h*.55);ctx.fillStyle='#725948';ctx.fillRect(x-w*.05,base-h*.88,w*.10,h*.33)}ctx.restore()})}
  function drawClouds(){ctx.fillStyle='rgba(255,255,255,.62)';for(let i=0;i<5;i++){const x=(i*210-(worldScroll*.03%210)),y=52+(i%3)*40;ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.arc(x+20,y-8,22,0,Math.PI*2);ctx.arc(x+43,y,16,0,Math.PI*2);ctx.fill()}}
  function drawBat(){const pinkSteps=Math.min(30,Math.floor(heartCount/10));const pinkRatio=pinkSteps/30;const bodyR=Math.round(28+115*pinkRatio),bodyG=Math.round(38+55*pinkRatio),bodyB=Math.round(48+90*pinkRatio);const wingR=Math.round(23+232*pinkRatio),wingG=Math.round(31+85*pinkRatio),wingB=Math.round(42+135*pinkRatio);const x=bat.x*W,y=bat.y,pulse=bat.wingPulse;const motion=Math.max(-1,Math.min(1,-bat.vy/520));const beat=pulse>0?Math.sin(bat.wingPhase)*pulse:0;const lift=beat*16+motion*8;const spread=44+Math.max(0,beat)*7;ctx.save();ctx.translate(x,y);if(state==='crash')ctx.rotate(crashRotation);ctx.fillStyle=`rgb(${bodyR},${bodyG},${bodyB})`;ctx.beginPath();ctx.ellipse(0,5,18,24,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0c1218';ctx.beginPath();ctx.arc(0,-10,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f4f5f6';ctx.beginPath();ctx.moveTo(-12,-9);ctx.lineTo(-5,-26);ctx.lineTo(2,-19);ctx.lineTo(9,-26);ctx.lineTo(14,-8);ctx.lineTo(6,-2);ctx.lineTo(-1,-9);ctx.lineTo(-8,-2);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-11,4,0,Math.PI*2);ctx.arc(6,-10,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1e252d';ctx.beginPath();ctx.arc(-5,-10,2,0,Math.PI*2);ctx.arc(7,-9,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffb5d0';ctx.beginPath();ctx.arc(-5,-11,2,0,Math.PI*2);ctx.arc(6,-10,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8eb8';ctx.beginPath();ctx.moveTo(14,-3);ctx.lineTo(27,2);ctx.lineTo(14,6);ctx.closePath();ctx.fill();ctx.fillStyle=`rgb(${Math.max(18,wingR)},${Math.max(24,wingG)},${Math.max(34,wingB)})`;ctx.beginPath();ctx.moveTo(-10,4);ctx.quadraticCurveTo(-31,-20-lift,-spread-lift*.22,-7+lift*.22);ctx.quadraticCurveTo(-33,10,-10,13);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(10,4);ctx.quadraticCurveTo(31,-20-lift,spread+lift*.22,-7+lift*.22);ctx.quadraticCurveTo(33,10,10,13);ctx.closePath();ctx.fill();ctx.strokeStyle='#ff8eb9';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-12,7);ctx.lineTo(-39-lift*.08,-5+lift*.2);ctx.moveTo(12,7);ctx.lineTo(39+lift*.08,-5+lift*.2);ctx.stroke();if(pinkRatio>0){ctx.globalAlpha=.06+.16*pinkRatio;ctx.fillStyle='#ff6fa6';ctx.beginPath();ctx.arc(0,4,30+8*pinkRatio,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.restore()}
  function draw(){ctx.save();if(screenShake)ctx.translate((Math.random()-.5)*W*screenShake,(Math.random()-.5)*H*screenShake);drawBackground();obstacles.forEach(drawObstacle);for(const h of hearts){ctx.save();ctx.translate(h.x,h.y+Math.sin(h.phase)*4);ctx.fillStyle='#ff6fa6';ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-16,0,-13,-13,-4,-13);ctx.bezierCurveTo(0,-13,2,-9,0,-6);ctx.bezierCurveTo(2,-9,4,-13,8,-13);ctx.bezierCurveTo(16,-13,18,0,0,10);ctx.fill();ctx.restore()}drawPlane();for(const p of wind){ctx.globalAlpha=Math.max(0,p.life/.6);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x-p.len*.45,p.y,p.x-p.len,p.y+2);ctx.stroke()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ff9fc8';ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;for(const p of heartBursts){ctx.save();ctx.globalAlpha=Math.max(0,p.life/.58);ctx.translate(p.x,p.y);const z=p.size;ctx.fillStyle='#ff6fa6';ctx.beginPath();ctx.moveTo(0,z);ctx.bezierCurveTo(-z*1.4,0,-z,-z,z*0,-z*.35);ctx.bezierCurveTo(z,-z,z*1.4,0,0,z);ctx.fill();ctx.restore()}ctx.globalAlpha=1;drawBat();ctx.restore()}
  function loop(now){const dt=Math.min(.033,Math.max(.001,(now-lastTime)/1000));lastTime=now;if(state==='play')update(dt);else if(state==='crash')updateCrash(dt);draw();raf=requestAnimationFrame(loop)}
  function pointerDown(e){e.preventDefault();if(state==='menu'||state==='over')resetGame();if(state==='play')holding=true}function pointerUp(){holding=false}addEventListener('pointerdown',pointerDown,{passive:false});addEventListener('pointerup',pointerUp);addEventListener('pointercancel',pointerUp);addEventListener('blur',pointerUp);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='menu'||state==='over')resetGame();holding=true}});addEventListener('keyup',e=>{if(e.code==='Space')holding=false});document.getElementById('again').onclick=resetGame;document.getElementById('share').onclick=async()=>{const score=finalEl.textContent;const msg=`I flew ${score}m and burst ${heartCount} hearts in Vicky the Bat! 🦇🌍 Last city: ${currentCity().name}. Can you beat me?`;try{if(navigator.share)await navigator.share({title:'Vicky the Bat',text:msg});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);alert('Score copied!')}else alert(msg)}catch(_){}};pillEl.textContent='BEST '+best+' m';scoreEl.innerHTML='0<small> m</small>';document.getElementById('heartScore').textContent='♥ 0';document.getElementById('heartProgress').textContent='0/300';cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
})();
