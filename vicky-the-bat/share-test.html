<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Vicky the Bat - Share Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182238;font-family:system-ui;color:white}body{touch-action:none}canvas{width:100%;height:100%;display:block}#hud{position:fixed;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}#m{font-size:48px;font-weight:1000}#m small{font-size:18px}#city{font-size:10px;letter-spacing:2px;font-weight:900}#best{background:#18223899;padding:9px 12px;border-radius:20px;font-size:10px;font-weight:900}#intro,#over{position:fixed;inset:0;display:grid;place-items:center;z-index:3;text-align:center;background:linear-gradient(#18223810,#182238b5)}#over{display:none}.title{font-size:clamp(54px,15vw,92px);font-weight:1000;letter-spacing:-5px;line-height:.82}.pink{color:#ff79ac}.bat{font-size:80px;margin-bottom:18px}button{border:0;border-radius:999px;padding:14px 34px;margin:5px;background:#ff6ea6;color:white;font-weight:1000;font-size:17px;box-shadow:0 6px #b43c70}.share{background:white;color:#ff4f93;box-shadow:0 6px #d6c5cc}.score{font-size:72px;font-weight:1000;color:#ff9fc7}</style></head><body><canvas id="c"></canvas><div id="hud"><div><div id="m">0<small> m</small></div><div id="city">PARIS</div></div><div id="best">BEST 0 m</div></div><div id="intro"><div><div class="bat">🦇</div><div class="title">VICKY <span class="pink">THE BAT</span></div></div></div><div id="over"><div><div style="font-size:11px;letter-spacing:2px;font-weight:1000">YOU FLEW</div><div id="score" class="score">0</div><div>metres</div><p id="nb"></p><button class="share" id="share">SHARE SCORE</button><button id="again">FLY AGAIN</button></div></div><script>const c=document.getElementById('c'),g=c.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1,state='menu',hold=false,t=0,dist=0,best=+localStorage.vickyShareBest||0,vy=0,y=0,last=0,city=0;const cities=['PARIS','EGYPT','NEW YORK','SYDNEY','LONDON','ROME'];function rs(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);if(state==='menu')y=H*.5}addEventListener('resize',rs);rs();function start(){state='play';document.getElementById('intro').style.display='none';document.getElementById('over').style.display='none';t=0;dist=0;vy=0;y=H*.5}function end(){state='over';let s=Math.floor(dist),nb=s>best;if(nb){best=s;localStorage.vickyShareBest=best}document.getElementById('score').textContent=s;document.getElementById('nb').textContent=nb?'NEW BEST!':'';document.getElementById('best').textContent='BEST '+best+' m';document.getElementById('over').style.display='grid'}function frame(ts){let dt=Math.min(.033,(ts-last)/1000||.016);last=ts;if(state==='play'){t+=dt;let sp=t<20?84:Math.min(440,84+(t-20)*3.6+dist*.14);dist+=sp*dt*.055;if(hold)vy-=1050*dt;vy+=790*dt;vy*=.994;y+=vy*dt;if(y<30||y>H-30)end();city=Math.floor(dist/39)%cities.length;document.getElementById('city').textContent=cities[city];document.getElementById('m').innerHTML=Math.floor(dist)+'<small> m</small>'}g.fillStyle='#95ccef';g.fillRect(0,0,W,H);g.fillStyle='#46637b';g.fillRect(0,H*.8,W,H*.2);g.fillStyle='#1b2530';g.beginPath();g.arc(W*.28,y,18,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(W*.25,y-5,4,0,Math.PI*2);g.arc(W*.32,y-5,4,0,Math.PI*2);g.fill();g.fillStyle='#ff8eb9';g.beginPath();g.moveTo(W*.32,y+2);g.lineTo(W*.43,y+5);g.lineTo(W*.32,y+8);g.fill();requestAnimationFrame(frame)}requestAnimationFrame(frame);function down(e){e.preventDefault();if(state==='menu'||state==='over')start();hold=true}function up(){hold=false}addEventListener('pointerdown',down,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up);document.getElementById('again').onclick=start;document.getElementById('share').onclick=async()=>{const score=document.getElementById('score').textContent;const msg=`I flew ${score}m in Vicky the Bat! 🦇🌍 Can you beat me?`;if(navigator.share){try{await navigator.share({title:'Vicky the Bat',text:msg})}catch(e){}}else{try{await navigator.clipboard.writeText(msg);alert('Score copied!')}catch(e){alert(msg)}}};document.getElementById('best').textContent='BEST '+best+' m';</script></body></html>
